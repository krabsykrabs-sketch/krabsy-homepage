# Live "Custom Nginx Configuration" of the krabsy static app before
# 2026-11-12 — kept for rollback. Paste back + Redeploy to undo.
server {
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }

    # Language-aware 404 handling for /de/
    location /de/ {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
        error_page 404 /de/404.html;
    }

    # Language-aware 404 handling for /es/
    location /es/ {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
        error_page 404 /es/404.html;
    }

    # Serve the German and Spanish 404 pages internally
    location = /de/404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /es/404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Fallback for URLs that don't match any language prefix
    error_page 404 /de/404.html;

    # 50x errors keep using the existing root-level page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

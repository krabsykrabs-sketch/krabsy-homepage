# ─────────────────────────────────────────────────────────────────────────────
# krabsy.com — nginx config for the Coolify "Static" app (base dir /homepage)
#
# NOT picked up from the repo automatically. Paste the whole file into
#   Coolify → Projects → krabsy (static app) → Configuration → General →
#   "Custom Nginx Configuration"   → Save → Redeploy
# See docs/seo-server-redirects.md for the full procedure + verification.
#
# What it does (all 301, relative Location headers):
#   1. 30 legacy stub URLs (/de|es/{drills,games,tools,reference,stats}/…)
#   2. /                → /de/            (brand root)
#   3. …/index.html     → …/              (one canonical URL per page)
#   4. /dir             → /dir/           (trailing-slash normalisation)
#   5. 404s: /es/… gets es/404.html, everything else de/404.html
# http→https and www→apex happen earlier, in Traefik (see the doc).
#
# Regenerate the legacy list after adding/removing stubs:
#   python3 tools/generate_sitemap.py --print-legacy-nginx
# ─────────────────────────────────────────────────────────────────────────────

map $uri $krabsy_legacy {
    default "";
    ~^/de/drills/drag-match/?(index\.html)?$  /de/unregelmaessige-verben/drag-match/;
    ~^/de/drills/falling-forms/?(index\.html)?$  /de/unregelmaessige-verben/falling-forms/;
    ~^/de/drills/fill-the-gap/?(index\.html)?$  /de/unregelmaessige-verben/fill-the-gap/;
    ~^/de/drills/sprint/?(index\.html)?$  /de/unregelmaessige-verben/sprint/;
    ~^/de/drills/type-race/?(index\.html)?$  /de/unregelmaessige-verben/type-race/;
    ~^/de/games/air-control/?(index\.html)?$  /de/spiele/air-control/;
    ~^/de/games/crab-slash/?(index\.html)?$  /de/spiele/crab-slash/;
    ~^/de/games/verb-platformer/?(index\.html)?$  /de/spiele/verb-platformer/;
    ~^/de/games/verb-slash/?(index\.html)?$  /de/spiele/verb-slash/;
    ~^/de/games/verb-snake/?(index\.html)?$  /de/spiele/verb-snake/;
    ~^/de/reference/?(index\.html)?$  /de/unregelmaessige-verben/uebersicht/;
    ~^/de/stats/?(index\.html)?$  /de/unregelmaessige-verben/statistik/;
    ~^/de/tools/flashcards/?(index\.html)?$  /de/unregelmaessige-verben/karteikarten/;
    ~^/de/tools/free-practice/?(index\.html)?$  /de/unregelmaessige-verben/freies-ueben/;
    ~^/de/tools/verb-table/?(index\.html)?$  /de/unregelmaessige-verben/verb-tabelle/;
    ~^/es/drills/drag-match/?(index\.html)?$  /es/verbos-irregulares/drag-match/;
    ~^/es/drills/falling-forms/?(index\.html)?$  /es/verbos-irregulares/falling-forms/;
    ~^/es/drills/fill-the-gap/?(index\.html)?$  /es/verbos-irregulares/fill-the-gap/;
    ~^/es/drills/sprint/?(index\.html)?$  /es/verbos-irregulares/sprint/;
    ~^/es/drills/type-race/?(index\.html)?$  /es/verbos-irregulares/type-race/;
    ~^/es/games/air-control/?(index\.html)?$  /es/juegos/air-control/;
    ~^/es/games/crab-slash/?(index\.html)?$  /es/juegos/crab-slash/;
    ~^/es/games/verb-platformer/?(index\.html)?$  /es/juegos/verb-platformer/;
    ~^/es/games/verb-slash/?(index\.html)?$  /es/juegos/verb-slash/;
    ~^/es/games/verb-snake/?(index\.html)?$  /es/juegos/verb-snake/;
    ~^/es/reference/?(index\.html)?$  /es/verbos-irregulares/resumen/;
    ~^/es/stats/?(index\.html)?$  /es/verbos-irregulares/estadisticas/;
    ~^/es/tools/flashcards/?(index\.html)?$  /es/verbos-irregulares/tarjetas/;
    ~^/es/tools/free-practice/?(index\.html)?$  /es/verbos-irregulares/practica-libre/;
    ~^/es/tools/verb-table/?(index\.html)?$  /es/verbos-irregulares/tabla-de-verbos/;
}

map $uri $krabsy_404 {
    ~^/es/  /es/404.html;
    default /de/404.html;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Location headers stay relative ("/de/"), so nginx behind Traefik never
    # emits http:// or :80 URLs.
    absolute_redirect off;

    error_page 404 $krabsy_404;

    # 1. legacy stubs
    if ($krabsy_legacy) {
        return 301 $krabsy_legacy;
    }

    # 3. explicit …/index.html → directory URL (query string kept)
    if ($request_uri ~ "^(?<krabsy_dir>[^?]*/)index\.html(?<krabsy_qs>\?.*)?$") {
        return 301 $krabsy_dir$krabsy_qs;
    }

    # 2. brand root
    location = / {
        return 301 /de/$is_args$args;
    }

    # 4. no trailing slash: directory → add slash, file → serve it
    location ~ ^(?<krabsy_path>.*[^/])$ {
        if (-d $document_root$krabsy_path) {
            return 301 $krabsy_path/$is_args$args;
        }
        try_files $uri =404;
    }

    # URIs ending in "/" → that directory's index.html
    location / {
        try_files $uri $uri/ =404;
    }
}

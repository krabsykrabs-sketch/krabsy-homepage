    <path fill="#ff8585" d="M12.6 19.5a4.4 4.4 0 0 1 8.8 0z"/>
    <circle fill="#2ee6c0" cx="9" cy="8" r="3.2"/>
    <path fill="#2ee6c0" d="M3 19.5a6 6 0 0 1 12 0z"/>
  </symbol>

  <!-- quiz room: a speech bubble with a question mark -->
  <symbol id="ki-quiz" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ffcf5e" d="M5.5 4h13a3 3 0 0 1 3 3v7.5a3 3 0 0 1-3 3H12l-4.5 3.5v-3.5h-2a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/>
    <path d="M9.8 9.2a2.3 2.3 0 1 1 3.1 2.1c-.6.3-.9.7-.9 1.3v.3"/>
    <circle fill="#2c2a3a" stroke="none" cx="12" cy="15.4" r="1.1"/>
  </symbol>
  <!-- topics: four tiles -->
  <symbol id="ki-topics" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect fill="#2ee6c0" x="3.5" y="3.5" width="7" height="7" rx="2"/>
    <rect fill="#ffcf5e" x="13.5" y="3.5" width="7" height="7" rx="2"/>
    <rect fill="#ffcf5e" x="3.5" y="13.5" width="7" height="7" rx="2"/>
    <rect fill="#2ee6c0" x="13.5" y="13.5" width="7" height="7" rx="2"/>
  </symbol>

  <!-- profile: a child -->
  <symbol id="ki-profile" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle fill="#ffcf5e" cx="12" cy="8.2" r="4"/>

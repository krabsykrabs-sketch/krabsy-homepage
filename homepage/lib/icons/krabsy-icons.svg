<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Krabsy icon set (style rules: lib/icons/README.md). Use:
       <svg class="ki" aria-hidden="true"><use href="/lib/icons/krabsy-icons.svg?v=…#ki-play"/></svg> -->

  <!-- games / play: a game pad -->
  <symbol id="ki-play" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#2ee6c0" d="M7.5 7h9a4.5 4.5 0 0 1 4.4 3.6l1 5a2.8 2.8 0 0 1-4.8 2.4L15 16H9l-2.1 2a2.8 2.8 0 0 1-4.8-2.4l1-5A4.5 4.5 0 0 1 7.5 7z"/>
    <path d="M7.5 10.5v3M6 12h3"/>
    <circle fill="#2c2a3a" stroke="none" cx="15.5" cy="11" r="1.1"/>
    <circle fill="#2c2a3a" stroke="none" cx="17.6" cy="13.2" r="1.1"/>
  </symbol>

  <!-- practise: a pencil -->
  <symbol id="ki-practise" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ffcf5e" d="M4 20l1-4.6L15.4 5a2.1 2.1 0 0 1 3 0l.6.6a2.1 2.1 0 0 1 0 3L8.6 19 4 20z"/>
    <path fill="#ff8585" d="M15.4 5a2.1 2.1 0 0 1 3 0l.6.6a2.1 2.1 0 0 1 0 3l-1.4 1.4-3.6-3.6z"/>
    <path d="M5 15.4l3.6 3.6"/>
  </symbol>

  <!-- diploma / certificate: a medal on two ribbons -->
  <symbol id="ki-diploma" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ff8585" d="M6 2.5h4.2l2.3 6.2H8.3z"/>
    <path fill="#ff8585" d="M18 2.5h-4.2l-2.3 6.2h4.2z"/>
    <circle fill="#ffcf5e" cx="12" cy="15" r="6"/>
    <path fill="#2c2a3a" stroke="none" d="M12 11.6l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z"/>
  </symbol>

  <!-- teacher: a graduation cap -->
  <symbol id="ki-teacher" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 11.5V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5"/>
    <path fill="#2ee6c0" d="M12 4.5 2.5 9.2 12 14l9.5-4.8z"/>
    <path d="M21.5 9.2v5"/>
  </symbol>

  <!-- class: two pupils -->
  <symbol id="ki-class" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle fill="#ff8585" cx="16.5" cy="8.5" r="2.6"/>
    <path fill="#ff8585" d="M12.6 19.5a4.4 4.4 0 0 1 8.8 0z"/>
    <circle fill="#2ee6c0" cx="9" cy="8" r="3.2"/>
    <path fill="#2ee6c0" d="M3 19.5a6 6 0 0 1 12 0z"/>
  </symbol>

  <!-- quiz room: a speech bubble with a question mark -->
  <symbol id="ki-quiz" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ffcf5e" d="M5.5 4h13a3 3 0 0 1 3 3v7.5a3 3 0 0 1-3 3H12l-4.5 3.5v-3.5h-2a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/>
    <path d="M9.8 9.2a2.3 2.3 0 1 1 3.1 2.1c-.6.3-.9.7-.9 1.3v.3"/>
    <circle fill="#2c2a3a" stroke="none" cx="12" cy="15.4" r="1.1"/>
  </symbol>
  <!-- topics: four tiles -->
  <symbol id="ki-topics" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect fill="#2ee6c0" x="3.5" y="3.5" width="7" height="7" rx="2"/>
    <rect fill="#ffcf5e" x="13.5" y="3.5" width="7" height="7" rx="2"/>
    <rect fill="#ffcf5e" x="3.5" y="13.5" width="7" height="7" rx="2"/>
    <rect fill="#2ee6c0" x="13.5" y="13.5" width="7" height="7" rx="2"/>
  </symbol>

  <!-- profile: a child -->
  <symbol id="ki-profile" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle fill="#ffcf5e" cx="12" cy="8.2" r="4"/>
    <path fill="#ff8585" d="M4.5 20.5a7.5 7.5 0 0 1 15 0z"/>
  </symbol>

  <!-- shell (Muschel / caracola): what a right answer earns -->
  <symbol id="ki-shell" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ff8585" d="M12 20.5c-1.6 0-2.8-.7-3.3-1.9L3.4 12.3a8.6 8.6 0 1 1 17.2 0l-5.3 6.3c-.5 1.2-1.7 1.9-3.3 1.9z"/>
    <path d="M12 17V5.5M9.8 17 6.6 8M14.2 17l3.2-9"/>
  </symbol>

  <!-- gift / surprise: a box with a bow -->
  <symbol id="ki-gift" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ff8585" d="M12 7.5C10.2 3.6 6.4 3.8 6.6 6c.1 1.3 2.6 1.6 5.4 1.5zM12 7.5c1.8-3.9 5.6-3.7 5.4-1.5-.1 1.3-2.6 1.6-5.4 1.5z"/>
    <rect fill="#ffcf5e" x="4.5" y="11.5" width="15" height="9" rx="2"/>
    <rect fill="#ffcf5e" x="3" y="7.5" width="18" height="4" rx="1.5"/>
    <path d="M12 7.5v13"/>
  </symbol>

  <!-- star (earned) and its empty twin: topic stars. The empty one is grey on purpose. -->
  <symbol id="ki-star" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ffcf5e" d="M12 3.3l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9-5.3-2.9-5.3 2.9 1.1-5.9-4.3-4.1 5.9-.8z"/>
  </symbol>
  <symbol id="ki-star-off" viewBox="0 0 24 24" fill="none" stroke="#babfd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#f3f3f8" d="M12 3.3l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9-5.3-2.9-5.3 2.9 1.1-5.9-4.3-4.1 5.9-.8z"/>
  </symbol>

  <!-- figure editor (2026-11-27): accessories, colours, clothes, random, turn, edit -->
  <!-- hat: a top hat with a band -->
  <symbol id="ki-hat" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#2ee6c0" d="M7.5 15V6.5A1.5 1.5 0 0 1 9 5h6a1.5 1.5 0 0 1 1.5 1.5V15z"/>
    <path fill="#ff8585" d="M7.5 11.5h9V15h-9z"/>
    <rect fill="#2ee6c0" x="3.5" y="15" width="17" height="4" rx="2"/>
  </symbol>
  <!-- palette: colours (skin, hair) -->
  <symbol id="ki-palette" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ffcf5e" d="M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 2.1-.9 2.1-1.9 0-1.5-1-1.7-1-2.9 0-1 .8-1.7 2-1.7h2.1c1.9 0 3.3-1.4 3.3-3.4 0-4-3.8-7.1-8.5-7.1z"/>
    <circle fill="#ff8585" stroke-width="1.5" cx="8" cy="10" r="1.5"/>
    <circle fill="#2c2a3a" stroke="none" cx="12" cy="7.6" r="1.3"/>
    <circle fill="#ff8585" stroke-width="1.5" cx="16" cy="9.6" r="1.5"/>
    <circle fill="#2c2a3a" stroke="none" cx="8.4" cy="14.6" r="1.3"/>
  </symbol>
  <!-- shirt: clothes -->
  <symbol id="ki-shirt" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#2ee6c0" d="M8.5 4 3 7l2 4 2.5-1.2V20h9V9.8L19 11l2-4-5.5-3a3.5 3.5 0 0 1-7 0z"/>
  </symbol>
  <!-- dice: random -->
  <symbol id="ki-dice" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect fill="#ffcf5e" x="4" y="4" width="16" height="16" rx="3.5"/>
    <g fill="#2c2a3a" stroke="none"><circle cx="8.6" cy="8.6" r="1.3"/><circle cx="15.4" cy="8.6" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="8.6" cy="15.4" r="1.3"/><circle cx="15.4" cy="15.4" r="1.3"/></g>
  </symbol>
  <!-- turn: a round arrow -->
  <symbol id="ki-turn" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12a7 7 0 1 1-2.2-5.1"/>
    <path d="M17.4 3.4v3.9h-3.9"/>
  </symbol>

  <!-- envelope: sign-in link by email ("Klasse sichern", Meine Klassen) -->
  <symbol id="ki-mail" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect fill="#ffcf5e" x="3" y="5.5" width="18" height="13" rx="2.5"/>
    <path d="M3.8 7.2l8.2 6 8.2-6"/>
  </symbol>

  <!-- shield with a tick: a class saved to the teacher's account -->
  <symbol id="ki-saved" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#2ee6c0" d="M12 3l7 2.8v5.4c0 4.4-3 7.8-7 9.3-4-1.5-7-4.9-7-9.3V5.8z"/>
    <path d="M8.6 12.2l2.4 2.4 4.4-4.6"/>
  </symbol>
</svg>

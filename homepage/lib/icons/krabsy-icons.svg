    <path fill="#ff8585" d="M15.4 5a2.1 2.1 0 0 1 3 0l.6.6a2.1 2.1 0 0 1 0 3l-1.4 1.4-3.6-3.6z"/>
    <path d="M5 15.4l3.6 3.6"/>
  </symbol>

  <!-- diploma / certificate: a medal on two ribbons -->
  <symbol id="ki-diploma" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ff8585" d="M6 2.5h4.2l2.3 6.2H8.3z"/>
    <path fill="#ff8585" d="M18 2.5h-4.2l-2.3 6.2h4.2z"/>
    <circle fill="#ffcf5e" cx="12" cy="15" r="6"/>
    <path fill="#2c2a3a" stroke="none" d="M12 11.6l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z"/>
  </symbol>

  <!-- teacher: a graduation cap -->
  <symbol id="ki-teacher" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 11.5V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5"/>
    <path fill="#2ee6c0" d="M12 4.5 2.5 9.2 12 14l9.5-4.8z"/>
    <path d="M21.5 9.2v5"/>
  </symbol>

  <!-- class: two pupils -->
  <symbol id="ki-class" viewBox="0 0 24 24" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<!doctype html>
<!-- Fill the Gap moved onto the drill shell (2026-11-28): every topic's Fill the Gap page
     runs lib/krabsy-drill.js itself. Old links to this file land on that page, with
     ?difficulty= and ?from= kept (data/topics.json: the topic's slug and page slug). -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Fill the Gap — Krabsy</title>
  <script>(function(){var q;try{q=new URLSearchParams(location.search);}catch(_){return;}var topic=q.get("topic")||"irregular_verbs",lang=q.get("lang");try{lang=lang||localStorage.getItem("krabsy_lang");}catch(_){}var keep=new URLSearchParams();["difficulty","from"].forEach(function(k){var v=q.get(k);if(v)keep.set(k,v);});var go=function(u){u+=keep.toString()?"?"+keep.toString():"";try{(window.top||window).location.replace(u);}catch(_){location.replace(u);}};fetch("/data/topics.json").then(function(r){return r.json();}).then(function(t){var x=t[topic]||t.irregular_verbs,p=x.pages&&x.pages["fill-the-gap"]||{},ui=[lang,"de","es","en"].filter(function(l){return l&&x[l]&&p[l];})[0];go(ui?"/"+ui+"/"+x[ui]+"/"+p[ui]+"/":"/de/unregelmaessige-verben/fill-the-gap/");}).catch(function(){go("/de/unregelmaessige-verben/fill-the-gap/");});})();</script>
</head>
<body>
  <p><a href="/de/unregelmaessige-verben/fill-the-gap/">Lückentext</a> · <a href="/es/verbos-irregulares/fill-the-gap/">Rellena el hueco</a></p>
</body>

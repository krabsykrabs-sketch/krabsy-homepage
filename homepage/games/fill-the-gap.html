<style>
/* ═══════════════════════════════════════════════════════════════════════════
   LÜCKENTEXT — Krabsy speed drill
   Arcade variant of fill-the-gap. Sentence card falls toward a danger line;
   player types the missing verb form into an input fixed at the bottom.
   Reuses the Falling Forms visual system, HUD, audio, scoring, and level-up.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --lavender:        #babfd8;
  --lavender-deep:   #6d75a6;
  --lavender-soft:   #d9ddec;
  --sage:            #cdd9b4;
  --sage-deep:       #9fb37c;
  --coral:           #f2937e;
  --coral-deep:      #c9685a;
  --coral-soft:      #fbe4de;
  --off-white:       #fdf8f3;
  --charcoal:        #2a2438;
  --charcoal-soft:   rgba(42, 36, 56, 0.65);

  --red-wrong:       #d04a3a;
  --red-wrong-deep:  #a83828;

  --shadow-elev:     0 6px 22px rgba(42, 36, 56, 0.18);
  --shadow-deep:     0 12px 38px rgba(42, 36, 56, 0.28);
  --shadow-inset:    inset 0 4px 18px rgba(109, 117, 166, 0.22);

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: 'Nunito', system-ui, sans-serif;
  color: var(--charcoal);
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}

body {
  /* Sandy / cream gradient — keeps the brand "sandy gold" tone and gives the
     lavender answer buttons enough contrast to read as foreground. */
  background:
    radial-gradient(circle at 18% 22%, rgba(255, 250, 232, 0.65), transparent 55%),
    radial-gradient(circle at 82% 78%, rgba(186, 152, 100, 0.18), transparent 55%),
    linear-gradient(160deg, #f4ecd6 0%, #e8d9b6 60%, #d9c594 100%);
}
/* Dot-pattern overlay — very low opacity, fixed (no per-frame paint) */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(rgba(42, 36, 56, 0.06) 1px, transparent 1.4px);
  background-size: 16px 16px;
  pointer-events: none;
  z-index: 0;
}

/* ── Top-level grid ─────────────────────────────────────────────────────── */

.ff-app {
  position: relative;
  z-index: 1;
  display: grid;
  height: 100%;
  width: 100%;
  min-width: 0;
  max-width: 980px;
  margin: 0 auto;
  grid-template-columns: 170px 1fr 200px;
  grid-template-rows: 52px 1fr;
  gap: 12px;
  padding: 12px;
}

/* ── Top bar ────────────────────────────────────────────────────────────── */

.ff-topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-elev), inset 0 1px 0 rgba(255,255,255,0.7);
}
.ff-round {
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.8px;
  color: var(--charcoal);
}
.ff-round span { color: var(--coral-deep); }
.ff-topbar-actions { display: flex; gap: 8px; }
.ff-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(109,117,166,0.35);
  background: rgba(255,255,255,0.7);
  color: var(--charcoal);
  font-size: 1rem;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background-color 0.15s ease, transform 0.1s ease, color 0.15s ease;
  user-select: none;
}
.ff-icon:hover { background: var(--coral-soft); color: var(--coral-deep); }
.ff-icon:active { transform: scale(0.94); }
.ff-icon.is-muted { color: var(--lavender-deep); opacity: 0.5; }

/* ── Sidebars (frosted-glass) ───────────────────────────────────────────── */

.ff-sidebar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.ff-panel {
  position: relative;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-elev), inset 0 1px 0 rgba(255,255,255,0.7);
}
.ff-panel-label {
  font-family: 'Nunito', system-ui, sans-serif;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 1.6px;
  color: var(--lavender-deep);
  margin-bottom: 6px;
  text-transform: uppercase;
}
.ff-panel-value {
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.7rem;
  line-height: 1;
  color: var(--charcoal);
  letter-spacing: 0.5px;
}

/* Score gets the dramatic coral treatment */
.ff-panel-score .ff-panel-value {
  font-size: 2.1rem;
  color: var(--coral-deep);
}

/* Level + progress bar */
.ff-level-bar {
  margin-top: 8px;
  height: 6px;
  background: rgba(109,117,166,0.18);
  border-radius: 999px;
  overflow: hidden;
}
.ff-level-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--coral), var(--coral-deep));
  border-radius: 999px;
  transition: width 0.4s ease;
}

/* Streak — glows when active */
.ff-panel-streak .ff-streak-fire {
  display: inline-block;
  margin-right: 4px;
  font-size: 1.2rem;
  filter: none;
  opacity: 0.35;
  transition: opacity 0.2s ease;
}
.ff-panel-streak.is-hot {
  box-shadow: var(--shadow-elev), 0 0 0 1px rgba(242,147,126,0.55), 0 0 18px rgba(242,147,126,0.45);
}
.ff-panel-streak.is-hot .ff-streak-fire { opacity: 1; }
.ff-panel-streak.is-hot .ff-panel-value { color: var(--coral-deep); }

/* Lives row */
.ff-lives {
  display: flex;
  gap: 6px;
  font-size: 1.4rem;
  line-height: 1;
}
.ff-heart {
  color: var(--coral);
  text-shadow: none;
  transition: color 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
}
.ff-heart.is-lost {
  color: rgba(109,117,166,0.35);
  opacity: 0.5;
  transform: scale(0.85);
}

/* Right sidebar — per-level board: 5 fixed slots that fill as the player
   completes verbs. Each tile staggers the three forms across the row:
   verb left, past centered, pp right — gives a stepped/transformation feel
   and avoids any single line overflowing the narrow sidebar. */
.ff-history {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 4px;
}
.ff-history-row {
  padding: 5px 10px;
  background: rgba(205, 217, 180, 0.30);
  border: 1px solid rgba(205, 217, 180, 0.55);
  border-radius: var(--r-sm);
  display: flex;
  flex-direction: column;
  gap: 0;
  line-height: 1.15;
}
.ff-history-row .ff-h-verb,
.ff-history-row .ff-h-past,
.ff-history-row .ff-h-pp {
  display: block;
  width: 100%;
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  letter-spacing: 0.3px;
}
.ff-history-row .ff-h-verb {
  text-align: left;
  font-size: 0.72rem;
  color: var(--lavender-deep);
  letter-spacing: 0.9px;
  margin-bottom: 1px;
}
.ff-history-row .ff-h-past {
  text-align: center;
  font-size: 0.92rem;
  color: var(--charcoal);
}
.ff-history-row .ff-h-pp {
  text-align: right;
  font-size: 0.92rem;
  color: var(--charcoal);
}

/* Empty slot: dashed outline + faded inner text so the panel size never
   jumps as the level fills in. */
.ff-history-row.is-empty {
  background: rgba(186, 191, 216, 0.10);
  border-style: dashed;
  border-color: rgba(109, 117, 166, 0.30);
}
.ff-history-row.is-empty .ff-h-verb,
.ff-history-row.is-empty .ff-h-past,
.ff-history-row.is-empty .ff-h-pp {
  color: rgba(109, 117, 166, 0.0);  /* hide text but keep the box height */
}

.ff-next {
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.6rem;
  color: var(--coral);
  opacity: 0.55;
  letter-spacing: 0.5px;
}

/* ── Play area ──────────────────────────────────────────────────────────── */

.ff-play {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.40) 0%, rgba(232, 217, 182, 0.35) 100%);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-elev), var(--shadow-inset);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.ff-block-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* Falling sentence card — wider than a verb block to fit a full clause.
   Uses transform: translate3d only (perf: GPU compositing). No box-shadow
   on the card itself; a static box-shadow on the inline blank composites
   into the same layer. */
.ff-block {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate3d(-50%, 0, 0);
  width: 90%;
  max-width: 620px;
  padding: 22px 32px 16px;
  background: rgba(253, 248, 243, 0.92);
  border: 2px solid var(--coral);
  border-radius: var(--r-md);
  text-align: center;
  will-change: transform;
}

.ff-sentence {
  font-family: 'Nunito', system-ui, sans-serif;
  font-size: 1.15rem;
  line-height: 1.55;
  color: var(--charcoal);
  letter-spacing: 0.2px;
}
.ff-sentence-hint {
  margin-top: 12px;
  font-family: 'Nunito', system-ui, sans-serif;
  font-size: 0.72rem;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--lavender-deep);
}
.ff-sentence-hint[hidden] { display: none; }
.ff-sentence-hint b {
  font-weight: 700;
  color: var(--charcoal);
  letter-spacing: 0.6px;
  text-transform: none;
  font-size: 0.95rem;
  margin-left: 4px;
}

/* Prep-only: the pattern hint reveals the answer ("interested + in"), so
   it's collapsed by default behind a small "?" button. Tap to reveal. The
   verb-side hint shows the base form which IS the question, so it's always
   visible — no button needed there. */
.ff-hint-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 12px;
  background: transparent;
  border: 1.5px solid var(--lavender);
  border-radius: 999px;
  font-family: 'Nunito', system-ui, sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--lavender-deep);
  padding: 4px 12px;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.ff-hint-btn:hover,
.ff-hint-btn:focus-visible {
  background: var(--lavender);
  color: #fff;
  outline: none;
}
.ff-hint-btn[hidden] { display: none; }
.ff-hint-btn-q {
  display: inline-flex;
  width: 16px; height: 16px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--lavender);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0;
}
.ff-hint-btn:hover .ff-hint-btn-q,
.ff-hint-btn:focus-visible .ff-hint-btn-q {
  background: #fff;
  color: var(--lavender-deep);
}

/* The inline blank within the sentence */
.ff-blank {
  display: inline-block;
  vertical-align: baseline;
  min-width: 78px;
  padding: 2px 12px;
  margin: 0 2px;
  border-radius: var(--r-sm);
  border: 1.5px solid rgba(109,117,166,0.35);
  background: rgba(255,255,255,0.45);
  color: var(--lavender-deep);
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.4px;
  transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
}
.ff-blank.is-asked {
  background: rgba(242,147,126,0.18);
  border-color: var(--coral);
  color: var(--coral-deep);
  box-shadow: 0 0 0 1px var(--coral), 0 0 14px rgba(242,147,126,0.45);
  animation: ff-blank-pulse 1.4s ease-in-out infinite;
}
.ff-blank.is-filled-correct {
  background: rgba(205, 217, 180, 0.55);
  border-color: var(--sage-deep);
  color: #4a5a2c;
}
.ff-blank.is-filled-wrong {
  background: rgba(208,74,58,0.20);
  border-color: var(--red-wrong);
  color: var(--red-wrong-deep);
}
@keyframes ff-blank-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.04); }
}

/* Wrong feedback — shake + coral flash, then dissolve */
.ff-block.is-shake {
  animation: ff-shake 0.32s cubic-bezier(.36,.07,.19,.97) both;
}
.ff-block.is-wrong { border-color: var(--coral-deep); background: rgba(251,228,222,0.95); }
.ff-block.is-correct { border-color: var(--sage-deep); background: rgba(225,235,205,0.95); }
.ff-block.is-dissolve {
  animation: ff-dissolve 0.45s ease forwards;
}
@keyframes ff-shake {
  10%, 90% { transform: translate3d(calc(-50% - 1px), var(--y, 0px), 0); }
  20%, 80% { transform: translate3d(calc(-50% + 3px), var(--y, 0px), 0); }
  30%, 50%, 70% { transform: translate3d(calc(-50% - 5px), var(--y, 0px), 0); }
  40%, 60% { transform: translate3d(calc(-50% + 5px), var(--y, 0px), 0); }
}
@keyframes ff-dissolve {
  to {
    transform: translate3d(-50%, var(--y, 0px), 0) scale(0.92);
    opacity: 0;
  }
}

/* Sage burst burst on correct fill */
.ff-burst {
  position: absolute;
  inset: 0;
  border-radius: var(--r-md);
  pointer-events: none;
  background: radial-gradient(circle, rgba(205,217,180,0.85) 0%, rgba(205,217,180,0) 65%);
  opacity: 0;
  animation: ff-burst-anim 0.45s ease-out forwards;
}
@keyframes ff-burst-anim {
  0%   { opacity: 0; transform: scale(0.8); }
  35%  { opacity: 0.95; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(1.2); }
}

/* Particles on chain complete */
.ff-particle {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--sage-deep);
  pointer-events: none;
  will-change: transform, opacity;
}

/* Floating score pop */
.ff-score-pop {
  position: absolute;
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.7rem;
  color: var(--coral-deep);
  pointer-events: none;
  white-space: nowrap;
  animation: ff-pop-anim 0.85s cubic-bezier(.2,.7,.3,1) forwards;
}
.ff-score-pop .ff-mult {
  font-size: 1rem;
  margin-left: 4px;
  vertical-align: super;
  color: var(--coral);
}
@keyframes ff-pop-anim {
  0%   { opacity: 0; transform: translate(-50%, 0) scale(0.85); }
  20%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -55px) scale(1); }
}

/* ── Answer buttons ─────────────────────────────────────────────────────── */

/* Input sits fixed at the bottom of the play area. Player types and presses
   Enter. Unlike Falling Forms (where buttons ride above the falling block),
   the input is stationary — the player needs a stable target while typing. */
.ff-input-wrap {
  position: absolute;
  left: 0; right: 0;
  bottom: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 18px;
  transition: opacity 0.15s ease;
}
.ff-input-wrap.is-hidden { opacity: 0; pointer-events: none; }

.ff-input {
  width: 280px;
  height: 60px;
  padding: 0 18px;
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.4px;
  text-align: center;
  color: var(--charcoal);
  background: rgba(255,255,255,0.85);
  border: 2px solid var(--lavender);
  border-radius: var(--r-md);
  outline: none;
  box-shadow: 0 4px 14px rgba(109,117,166,0.30), inset 0 1px 0 rgba(255,255,255,0.40);
  transition: border-color 0.15s ease, box-shadow 0.15s ease,
              background-color 0.15s ease, color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.ff-input::placeholder {
  color: rgba(109, 117, 166, 0.45);
  font-family: 'Nunito', system-ui, sans-serif;
  font-size: 0.9rem;
  letter-spacing: 0.6px;
}
.ff-input:focus {
  border-color: var(--lavender-deep);
  box-shadow:
    0 4px 14px rgba(109,117,166,0.40),
    0 0 22px rgba(186,191,216,0.55),
    inset 0 1px 0 rgba(255,255,255,0.40);
}
.ff-input.is-flash-correct {
  border-color: var(--sage-deep);
  background: rgba(205, 217, 180, 0.85);
  color: #2a4014;
}
.ff-input.is-flash-wrong {
  border-color: var(--red-wrong);
  background: rgba(208, 74, 58, 0.18);
  color: var(--red-wrong-deep);
  animation: ff-input-shake 0.32s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes ff-input-shake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(3px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
  40%, 60% { transform: translate3d(5px, 0, 0); }
}
.ff-input:disabled, .ff-input:read-only { cursor: default; }

.ff-input-hint {
  font-family: 'Nunito', system-ui, sans-serif;
  font-size: 0.62rem;
  letter-spacing: 1.5px;
  color: var(--lavender-deep);
  text-align: center;
  pointer-events: none;
}

/* ── Pause overlay ──────────────────────────────────────────────────────── */

.ff-pause-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(42, 36, 56, 0.55);
  border-radius: var(--r-lg);
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 3rem;
  color: var(--off-white);
  letter-spacing: 2px;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.ff-pause-overlay small {
  font-size: 0.8rem;
  font-family: 'Nunito', system-ui, sans-serif;
  letter-spacing: 1.5px;
  margin-top: 16px;
  opacity: 0.8;
}
.ff-pause-overlay.is-shown {
  opacity: 1;
  pointer-events: auto;
  cursor: pointer;
}

/* ── Modal screens (start, game over, narrow warning) ───────────────────── */

.ff-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(42, 36, 56, 0.55);
  z-index: 100;
  padding: 32px;
}
.ff-screen[hidden] { display: none; }
.ff-screen-card {
  background: rgba(253, 248, 243, 0.97);
  border-radius: var(--r-lg);
  padding: 44px 56px;
  text-align: center;
  box-shadow: var(--shadow-deep);
  border: 1px solid rgba(255,255,255,0.7);
  max-width: 640px;
  width: 100%;
}
.ff-title {
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 3.6rem;
  color: var(--coral-deep);
  letter-spacing: 1.5px;
  margin: 0 0 8px;
  line-height: 1.05;
}
.ff-tagline {
  font-size: 0.95rem;
  color: var(--charcoal-soft);
  margin: 0 0 28px;
  letter-spacing: 0.4px;
}
.ff-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 36px;
  background: linear-gradient(180deg, var(--coral) 0%, var(--coral-deep) 100%);
  color: var(--off-white);
  border: none;
  border-radius: 999px;
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.15rem;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(201,104,90,0.40), 0 0 24px rgba(242,147,126,0.45);
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}
.ff-btn:hover { transform: translateY(-1px); }
.ff-btn:active { transform: translateY(1px); }
.ff-btn-ghost {
  background: transparent;
  color: var(--coral-deep);
  box-shadow: none;
  text-decoration: underline;
}
.ff-best-row {
  margin-top: 18px;
  font-size: 0.9rem;
  color: var(--charcoal-soft);
  letter-spacing: 0.5px;
}
.ff-best-row strong { color: var(--coral-deep); }

.ff-over-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  max-width: 360px;
  margin: 22px auto;
}
.ff-over-stat {
  padding: 14px;
  background: rgba(186, 191, 216, 0.25);
  border-radius: var(--r-md);
}
.ff-over-stat-label {
  font-size: 0.6rem;
  letter-spacing: 1.6px;
  color: var(--lavender-deep);
  text-transform: uppercase;
}
.ff-over-stat-value {
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.7rem;
  color: var(--charcoal);
  margin-top: 4px;
}
.ff-over-stat-value.is-coral { color: var(--coral-deep); }
.ff-new-best[hidden] { display: none; }
.ff-new-best {
  display: inline-block;
  margin: 0 0 20px;
  padding: 6px 18px;
  background: linear-gradient(90deg, var(--coral), var(--coral-deep));
  color: var(--off-white);
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 1.6px;
  border-radius: 999px;
  box-shadow: 0 0 22px rgba(242,147,126,0.55);
}
.ff-chain-grid {
  margin: 18px 0 26px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  max-height: 130px;
  overflow-y: auto;
}
.ff-chain-grid-row {
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 0.78rem;
  color: var(--charcoal);
  background: rgba(205, 217, 180, 0.35);
  border: 1px solid rgba(205, 217, 180, 0.55);
  border-radius: var(--r-sm);
  padding: 4px 10px;
  letter-spacing: 0.3px;
}
.ff-actions { display: flex; gap: 14px; justify-content: center; align-items: center; }

.ff-teacher {
  margin: -14px 0 22px;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--lavender-deep);
}
.ff-teacher[hidden] { display: none; }
/* Icons drawn inline (no emoji glyphs): streak flame, pause bars, teacher cap */
.ff-ico { width: 1em; height: 1em; vertical-align: -0.12em; }
.ff-icon .ff-ico { width: 16px; height: 16px; }
.ff-teacher .ff-ico { width: 1.25em; height: 1.25em; margin-right: 5px; vertical-align: -0.25em; }

/* ── Input row: OK button (touch / narrow) + accent keys (Spanish) ─────── */
.ff-input-row { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 100%; }
.ff-go {
  display: none;
  flex: 0 0 auto;
  height: 60px;
  min-width: 64px;
  padding: 0 16px;
  border: none;
  border-radius: var(--r-md);
  background: linear-gradient(180deg, var(--coral) 0%, var(--coral-deep) 100%);
  color: var(--off-white);
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 1.15rem;
  letter-spacing: 0.6px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(201,104,90,0.35);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ff-go:active { transform: translateY(1px); }
.ff-keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.ff-keys[hidden] { display: none; }
.ff-key {
  min-width: 40px;
  height: 40px;
  padding: 0 8px;
  border: 1.5px solid var(--lavender);
  border-radius: var(--r-sm);
  background: rgba(255,255,255,0.85);
  color: var(--charcoal);
  font-family: 'Nunito', system-ui, sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ff-key:hover { background: var(--lavender-soft); }
.ff-key:active { background: var(--lavender); color: #fff; }

/* Touch screens and narrow frames: the input sits right under the sentence
   card (top set from JS), so the on-screen keyboard can't cover it, with an
   OK button instead of "press Enter". */
body.ff-compact .ff-input-wrap { bottom: auto; }
body.ff-compact .ff-go { display: inline-flex; align-items: center; justify-content: center; }
body.ff-compact .ff-input-hint { display: none; }

/* ── Phones and narrow frames (< 900 px): one column, stats in a strip ── */
@media (max-width: 899px) {
  .ff-app {
    grid-template-columns: 1fr;
    grid-template-rows: 44px auto 1fr;
    gap: 8px;
    padding: 8px;
  }
  .ff-topbar { padding: 0 8px 0 14px; }
  .ff-round { font-size: 1rem; }
  .ff-icon { width: 34px; height: 34px; }
  .ff-sidebar-left { flex-direction: row; gap: 6px; }
  .ff-sidebar-left .ff-panel { flex: 1 1 0; min-width: 0; padding: 6px 8px; }
  .ff-panel-label { font-size: 0.55rem; letter-spacing: 0.8px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ff-panel-value { font-size: 1.15rem; }
  .ff-panel-score .ff-panel-value { font-size: 1.3rem; }
  .ff-panel-streak .ff-streak-fire { font-size: 0.9rem; margin-right: 2px; }
  .ff-level-bar { margin-top: 4px; height: 4px; }
  .ff-lives { font-size: 1.05rem; gap: 2px; }
  .ff-sidebar-right { display: none; }
  .ff-block { width: calc(100% - 16px); padding: 14px 14px 10px; }
  .ff-sentence { font-size: 1.05rem; line-height: 1.45; }
  .ff-blank { min-width: 64px; padding: 1px 8px; font-size: 1.05rem; }
  .ff-sentence-hint, .ff-hint-btn { margin-top: 8px; }
  .ff-input-wrap { padding: 0 8px; gap: 6px; }
  .ff-input { width: auto; flex: 1 1 auto; min-width: 0; max-width: 280px; height: 52px; font-size: 1.3rem; }
  .ff-go { height: 52px; }
  .ff-key { min-width: 36px; height: 38px; }
  /* Card near the top: on a phone the lower part of the frame may sit under
     the site's tab bar or the keyboard. */
  .ff-screen { padding: 16px 12px; align-items: flex-start; overflow-y: auto; }
  .ff-screen-card { padding: 28px 20px; }
  .ff-title { font-size: 2.4rem; }
  .ff-tagline { margin-bottom: 22px; }
  .ff-levelup-card { padding: 28px 36px 24px; }
  .ff-levelup-num { font-size: 4.5rem; }
}
@media (max-width: 359px) {
  .ff-panel-label { font-size: 0.5rem; letter-spacing: 0.4px; }
  .ff-title { font-size: 2rem; }
}

/* ── Level-up overlay ─────────────────────────────────────────────────────
   Pauses the game briefly between levels. Lives on top of the playfield,
   underneath the start/game-over modals (z 50 vs 100). */
.ff-levelup {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(42, 36, 56, 0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.ff-levelup[hidden] { display: none; }
.ff-levelup.is-shown {
  opacity: 1;
  pointer-events: auto;
  cursor: pointer;
}

.ff-levelup-card {
  position: relative;
  text-align: center;
  padding: 36px 60px 32px;
  background: rgba(253, 248, 243, 0.97);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-deep);
  transform: scale(0.7);
  opacity: 0;
}
.ff-levelup.is-shown .ff-levelup-card {
  animation: ff-levelup-in 0.45s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes ff-levelup-in {
  0%   { transform: scale(0.7);  opacity: 0; }
  60%  { transform: scale(1.06); opacity: 1; }
  100% { transform: scale(1);    opacity: 1; }
}

/* Expanding coral rings behind the card */
.ff-levelup-card::before,
.ff-levelup-card::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 220px; height: 220px;
  border: 2px solid var(--coral);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  opacity: 0;
  pointer-events: none;
}
.ff-levelup.is-shown .ff-levelup-card::before {
  animation: ff-ring-expand 1.1s ease-out 0.05s forwards;
}
.ff-levelup.is-shown .ff-levelup-card::after {
  animation: ff-ring-expand 1.1s ease-out 0.35s forwards;
}
@keyframes ff-ring-expand {
  0%   { opacity: 0.6; transform: translate(-50%, -50%) scale(0.5); }
  100% { opacity: 0;   transform: translate(-50%, -50%) scale(2.4); }
}

.ff-levelup-badge {
  display: inline-block;
  padding: 5px 16px;
  background: linear-gradient(90deg, var(--coral), var(--coral-deep));
  color: var(--off-white);
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 2.5px;
  border-radius: 999px;
  margin-bottom: 12px;
  box-shadow: 0 0 18px rgba(242,147,126,0.55);
}
.ff-levelup-num {
  font-family: 'Fredoka Display', 'Nunito', sans-serif;
  font-size: 6rem;
  line-height: 1;
  color: var(--coral-deep);
  letter-spacing: 1.5px;
  margin: 4px 0 8px;
}
.ff-levelup-sub {
  font-family: 'Nunito', system-ui, sans-serif;
  font-size: 0.95rem;
  color: var(--charcoal-soft);
  letter-spacing: 0.5px;
}
/* Score-panel pulse when points land — pure transform, no shadow animation. */
.ff-panel-score.is-pulse .ff-panel-value {
  animation: ff-score-pulse 0.5s ease-out;
}
@keyframes ff-score-pulse {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.14); }
  100% { transform: scale(1); }
}
/* Krabsy icons (inline copies of lib/icons/krabsy-icons.svg; no emojis or ♥ ♪ ✕) */
.ff-ki { width: 20px; height: 20px; display: block; flex: 0 0 auto; }
.ff-heart .ff-ki { width: 1em; height: 1em; }
.ff-heart.is-lost .ff-ki { filter: grayscale(1); }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════

     ═══════════════════════════════════════════════════════════════════ -->

        <span class="ff-heart" data-i="1"><svg class="ff-ki" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="#ff8585" d="M12 20 4.7 12.9a4.6 4.6 0 0 1 0-6.6 4.7 4.7 0 0 1 6.6 0l.7.7.7-.7a4.7 4.7 0 0 1 6.6 0 4.6 4.6 0 0 1 0 6.6z"/></svg></span>
        <span class="ff-heart" data-i="2"><svg class="ff-ki" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="#ff8585" d="M12 20 4.7 12.9a4.6 4.6 0 0 1 0-6.6 4.7 4.7 0 0 1 6.6 0l.7.7.7-.7a4.7 4.7 0 0 1 6.6 0 4.6 4.6 0 0 1 0 6.6z"/></svg></span>

  <main class="ff-play" id="ff-play" aria-label="Spielfeld" data-string-aria="aria_playarea">
    <div class="ff-block-layer" id="ff-block-layer" aria-live="polite"></div>
    <form class="ff-input-wrap" id="ff-input-wrap" autocomplete="off">
      <div class="ff-input-row">
      <input
        class="ff-input"
        id="ff-input"
        type="text"
        inputmode="text"
        autocapitalize="off"

        spellcheck="false"
        enterkeyhint="go"
        aria-label="Fehlendes Wort eintippen"
        data-string-aria="aria_input"

        data-string-attr="placeholder:input_placeholder"

<!-- ═══════════════════════════════════════════════════════════════════════
     SCREENS — start, game over
     ═══════════════════════════════════════════════════════════════════ -->
<div class="ff-screen" id="ff-start-screen">
  <div class="ff-screen-card">
    <h1 class="ff-title" data-string="title">Lückentext</h1>
    <p class="ff-tagline" data-string="start_tagline">Lies den Satz und tippe, was in die Lücke gehört. Drei Leben pro Runde.</p>
    <p class="ff-teacher" id="ff-teacher" hidden></p>
    <button class="ff-btn" id="ff-start-btn" type="button" data-string="start_btn">Los geht's!</button>
    <div class="ff-best-row"><span data-string="best_label">Bestleistung</span>: <strong id="ff-best-start">0</strong></div>
  </div>
</div>

<div class="ff-screen" id="ff-over-screen" hidden>
  <div class="ff-screen-card">
    <div class="ff-new-best" id="ff-new-best" hidden data-string="new_best">Neue Bestleistung!</div>
    <h1 class="ff-title" data-string="game_over">Spiel vorbei</h1>
    <div class="ff-over-grid">
      <div class="ff-over-stat">
        <div class="ff-over-stat-label" data-string="final_score">Endpunktzahl</div>
        <div class="ff-over-stat-value is-coral" id="ff-final-score">0</div>
      </div>
      <div class="ff-over-stat">
        <div class="ff-over-stat-label" data-string="best_label">Bestleistung</div>
        <div class="ff-over-stat-value" id="ff-final-best">0</div>
      </div>

    <div class="ff-chain-grid" id="ff-chain-grid" aria-label="Abgeschlossene Ketten" data-string-aria="aria_chain_grid"></div>
    <div class="ff-actions">
      <button class="ff-btn" id="ff-again-btn" type="button" data-string="play_again">Nochmal spielen</button>
      <button class="ff-btn ff-btn-ghost" id="ff-menu-btn" type="button" data-string="menu">Menü</button>
    </div>
  </div>
</div>

<div class="ff-levelup" id="ff-levelup-screen" hidden aria-live="polite">
  <div class="ff-levelup-card">
    <div class="ff-levelup-badge">LEVEL UP</div>
    <div class="ff-levelup-num" id="ff-levelup-num">2</div>
    <div class="ff-levelup-sub" id="ff-levelup-sub">Weiter so!</div>
  </div>
</div>

<script>
const ICON_SOUND = '<svg class="ff-ki" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="#ffcf5e" d="M4 9h3l4.5-3.8v13.6L7 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"/><path d="M15 9.2a4 4 0 0 1 0 5.6M17.8 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>';
const ICON_MUTE = '<svg class="ff-ki" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="#2c2a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="#ffcf5e" d="M4 9h3l4.5-3.8v13.6L7 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>';
// ═══════════════════════════════════════════════════════════════════════════
//  SENTENCES — loaded on boot. Source depends on the `?topic=` query param:
//    irregular_verbs (default) → /data/irregular-verbs.json
//    prepositions              → /data/prepositions.json
//  Each entry is projected to the in-memory shape:
//    { verb, form, correct, alts, sentence, hintLabel }
//  `hintLabel` names the i18n key for the hint chip on that row, so verb
//  rows show "Verb fly" while prep rows show "Muster wait + for".
// ═══════════════════════════════════════════════════════════════════════════
const TOPIC = new URLSearchParams(location.search).get('topic')
              || 'irregular_verbs';
let SENTENCES = [];   // populated by loadSentences()
// Newer topics (format v2, content/FORMAT.md) live in /data/<id with - for _>.json,
// e.g. es_ser → /data/es-ser.json.
const GAP_TOPIC = TOPIC !== 'prepositions' && TOPIC !== 'irregular_verbs'
  && /^[a-z0-9_]{1,40}$/.test(TOPIC);
const DATA_URL = TOPIC === 'prepositions'
  ? '/data/prepositions.json'
  : GAP_TOPIC ? '/data/' + TOPIC.replace(/_/g, '-') + '.json'
  : '/data/irregular-verbs.json';
let LEARN_LANG = 'en';

async function loadSentences() {
  const res = await fetch(DATA_URL, { cache: GAP_TOPIC ? 'no-cache' : 'force-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const all = await res.json();
  if (GAP_TOPIC) {
    // Format v2: items → examples; the hint (interface language) goes in
    // brackets after the sentence, like in every other game.
    LEARN_LANG = all.learn_lang || 'en';
    SENTENCES = [];
    for (const it of (all.items || [])) {
      for (const ex of (it.examples || [])) {
        if (typeof ex.sentence !== 'string' || !ex.sentence.includes('___')) continue;
        const ans = Array.isArray(ex.answers) ? ex.answers : [];
        if (!ans[0]) continue;
        const h = ex.hint ? (typeof ex.hint === 'string' ? ex.hint : (ex.hint[LANG] || ex.hint.en || '')) : '';
        SENTENCES.push({
          id: it.id,                         // item id (stats), as Sprint records it
          verb: it.label || it.id,
          form: 'default',
          correct: ans[0],
          alts: ans.slice(1),
          sentence: h ? ex.sentence + ' (' + h + ')' : ex.sentence,
          hintLabel: 'pattern_hint',
          level: ex.difficulty || 1,
        });
      }
    }
  } else if (TOPIC === 'prepositions') {
    SENTENCES = [];
    for (const uc of (all || [])) {
      for (const ex of (uc.examples || [])) {
        if (typeof ex.sentence !== 'string' || !ex.sentence.includes('___')) continue;
        const valid = Array.isArray(ex.valid_answers) ? ex.valid_answers : [];
        if (!valid[0]) continue;
        SENTENCES.push({
          id: uc.id,                         // use-case id (stats)
          verb: uc.pattern,                  // shown in hint chip
          form: 'default',
          correct: valid[0],
          alts: valid.slice(1),
          sentence: ex.sentence,
          hintLabel: 'pattern_hint',
          level: ex.difficulty || 1,
        });
      }
    }
  } else {
    SENTENCES = (all || [])
      .filter(x =>
        typeof x.context_sentence === 'string' &&
        x.context_sentence.includes('___') &&
        typeof x.correct_answer === 'string' &&
        x.correct_answer.length > 0
      )
      .map(x => ({
        id: x.verb,                          // verb base form (stats)
        verb: x.verb || x.hint || '',
        form: x.form || 'past',
        correct: x.correct_answer,
        alts:    Array.isArray(x.correct_alt) ? x.correct_alt : [],
        sentence: x.context_sentence,
        hintLabel: 'verb_hint',
        level: x.tier || 1,
      }));
  }
  // Teacher practice link (?difficulty=N): level ≤ N (verbs: tier, sentences: difficulty);
  // too few left → keep all (same rule as the site question engine).
  try {
    const lvl = parseInt(new URLSearchParams(location.search).get('difficulty'), 10);
    if (lvl >= 1 && lvl <= 3) {
      const keep = SENTENCES.filter(s => (s.level || 1) <= lvl);
      if (keep.length >= 6) SENTENCES = keep;
    }
  } catch (_) {}
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function readBest() {
  try {
    const raw = localStorage.getItem(BEST_KEY);
    const n = Number(raw);
    return Number.isFinite(n) && n > 0 ? n : 0;
  } catch (_) { return 0; }
}
function writeBest(n) {
  try { localStorage.setItem(BEST_KEY, String(n)); } catch (_) {}
}
function readAudio() {
  try {
    const raw = localStorage.getItem(AUDIO_KEY);
    return raw === null ? true : raw === '1';
  } catch (_) { return true; }
}
function writeAudio(on) {
  try { localStorage.setItem(AUDIO_KEY, on ? '1' : '0'); } catch (_) {}
}

// Irregular verbs start easy: tier-1 verbs (go, see, buy …) for levels 1–2,
// tiers 1–2 for levels 3–4, then all 172. Other topics use every sentence.
function tierCap() {
  if (TOPIC !== 'irregular_verbs') return 99;
  const lvl = levelFromCompletions(state.completions);
  return lvl <= 2 ? 1 : lvl <= 4 ? 2 : 99;
}
function refillDeck() {
  const cap = tierCap();
  let idx = SENTENCES.map((_, i) => i).filter(i => (SENTENCES[i].level || 1) <= cap);
  if (idx.length < 6) idx = SENTENCES.map((_, i) => i);
  state.deck = shuffle(idx);
  state.deckPos = 0;
  state.deckCap = cap;
}
function drawItem() {
  if (state.deckPos >= state.deck.length || state.deckCap !== tierCap()) refillDeck();
  return SENTENCES[state.deck[state.deckPos++]];
}
// Normalize a typed input or correct answer for comparison.
// Spanish topics: accents are not required when typing (kids on English
// keyboards); the blank then shows the right spelling with the accent.
function normalizeAnswer(s) {
  let v = (s == null ? '' : String(s)).trim().toLowerCase();
  if (LEARN_LANG === 'es') v = v.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return v;
}

function levelFromCompletions(c) { return Math.floor(c / LEVEL_STEP) + 1; }
function streakMultiplier(s) {
  for (const [min, mult] of STREAK_TIERS) if (s >= min) return mult;
  return 1;
}

//  AUDIO — Web Audio API, synthesized envelopes
// ═══════════════════════════════════════════════════════════════════════════
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (_) { audioCtx = null; }
  return audioCtx;
}
function playTone({ type='sine', from=600, to=900, dur=120, vol=0.18, delay=0 }) {
  if (!state.audioOn) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(from, t0);
  osc.frequency.linearRampToValueAtTime(to, t0 + dur / 1000);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur / 1000);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur / 1000 + 0.02);
}
function sfxCorrectFill()   { playTone({ from: 620, to: 920, dur: 120, vol: 0.16 }); }
function sfxChainComplete() {
  // Brighter chord — three sines, slight stagger
  playTone({ from: 660, to: 660, dur: 250, vol: 0.13 });
  playTone({ from: 830, to: 830, dur: 250, vol: 0.11, delay: 0.01 });
  playTone({ from: 990, to: 1180, dur: 260, vol: 0.10, delay: 0.02 });
}
function sfxWrong()         { playTone({ type: 'square', from: 180, to: 140, dur: 200, vol: 0.12 }); }
function sfxMissedBlock()   { playTone({ type: 'square', from: 90,  to: 60,  dur: 240, vol: 0.16 }); }
function sfxLifeLost()      { playTone({ type: 'sawtooth', from: 480, to: 180, dur: 380, vol: 0.13 }); }
function sfxLevelUp() {
  // Ascending arpeggio — four notes climbing into a final held pad.
  playTone({ from: 523, to: 523, dur: 110, vol: 0.13, delay: 0.00 });
  playTone({ from: 659, to: 659, dur: 110, vol: 0.13, delay: 0.08 });
  playTone({ from: 784, to: 784, dur: 110, vol: 0.13, delay: 0.16 });
  playTone({ from: 988, to: 1175, dur: 420, vol: 0.12, delay: 0.24 });

// ═══════════════════════════════════════════════════════════════════════════
//  CARD lifecycle — spawn a static sentence card, resolve on submit.
//  No falling: no timer pressure, no miss-by-timeout. Lives only drop on
//  wrong answers. Each spawn just renders the next sentence in place.
// ═══════════════════════════════════════════════════════════════════════════
function spawnBlock() {
  if (state.block && state.block.el) state.block.el.remove();
  state.currentItem = state.nextItem || drawItem();
  state.nextItem = drawItem();

  const item = state.currentItem;

  // Split context_sentence around the "___" placeholder into two halves so
  // we can render an inline blank with full styling.
  const [pre, post] = splitSentence(item.sentence);
  const blockEl = document.createElement('div');
  blockEl.className = 'ff-block';
  const y = blockY();
  blockEl.style.setProperty('--y', y + 'px');
  blockEl.style.transform = `translate3d(-50%, ${y}px, 0)`;
  // Prep hints reveal the answer ("interested + in") — start collapsed
  // behind a "?" button. Verb hints show the base form, which IS the
  // question, so they stay always-visible.
  const hintCollapsed = (TOPIC === 'prepositions' || GAP_TOPIC);
  const hintLabelKey = item.hintLabel || 'verb_hint';
  const hintLabelText = t('hint_show') || (LANG === 'es' ? 'Pista' : 'Tipp');
  const hintInnerHtml = `<span data-string="${hintLabelKey}">${t(hintLabelKey)}</span> <b>${escapeHtml(item.verb)}</b>`;
  blockEl.innerHTML = `
    <div class="ff-sentence">
      <span>${escapeHtml(pre)}</span><span class="ff-blank is-asked" id="ff-blank">___</span><span>${escapeHtml(post)}</span>
    </div>
    ${hintCollapsed
      ? `<button type="button" class="ff-hint-btn" id="ff-hint-btn" aria-expanded="false" aria-controls="ff-current-hint">
           <span class="ff-hint-btn-q" aria-hidden="true">?</span>
           <span>${escapeHtml(hintLabelText)}</span>
         </button>
         <div class="ff-sentence-hint" id="ff-current-hint" hidden>${hintInnerHtml}</div>`
      : `<div class="ff-sentence-hint" id="ff-current-hint">${hintInnerHtml}</div>`
    }
  `;
  els.blockLayer.appendChild(blockEl);

  if (hintCollapsed) {
    const btn = blockEl.querySelector('#ff-hint-btn');
    const hint = blockEl.querySelector('#ff-current-hint');
    if (btn && hint) {
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', function () {
        hint.hidden = false;
        btn.hidden = true;
        btn.setAttribute('aria-expanded', 'true');
        placeInput();   // the card grew
        // Keyboard focus stays in the input — don't yank it on hint reveal.
        if (els.input) els.input.focus();
      });
    }
  }

  state.block = {
    el: blockEl,
    isDying: false,
  };
  placeInput();
  prepareInput();
  renderNext();
}

function splitSentence(s) {
  const idx = s.indexOf('___');
  if (idx < 0) return [s, ''];
  return [s.slice(0, idx), s.slice(idx + 3)];
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}

function prepareInput() {
  els.input.value = '';
  els.input.readOnly = false;
  els.input.classList.remove('is-flash-correct', 'is-flash-wrong');
  els.inputWrap.classList.remove('is-hidden');
  // Focus now (still inside the Start tap, so a phone opens its keyboard) and
  // again next tick so the spawn animation doesn't fight the focus call.
  // readOnly (not disabled) between questions keeps the focus, so the phone
  // keyboard stays open from one sentence to the next.
  try { els.input.focus({ preventScroll: true }); } catch (_) {}
  setTimeout(() => { try { els.input.focus({ preventScroll: true }); } catch (_) {} }, 0);
}
// ═══════════════════════════════════════════════════════════════════════════
//  Answer resolution — typed input + Enter
// ═══════════════════════════════════════════════════════════════════════════
function handleSubmit() {
  if (!state.running || state.paused) return;
  if (!state.block || state.block.isDying) return;
  const item = state.currentItem;
  if (!item) return;
  const typed = normalizeAnswer(els.input.value);
  if (!typed) return; // ignore empty Enter
  const target = normalizeAnswer(item.correct);
  const alts = (item.alts || []).map(normalizeAnswer);
  const isCorrect = typed === target || alts.includes(typed);
  recordAnswer(item, isCorrect);
  if (isCorrect) onCorrect(item);
  else           onWrong(item);
}

function onCorrect(item) {
  sfxChainComplete();
  els.input.readOnly = true;
  els.input.classList.add('is-flash-correct');

  // Fill the inline blank with the canonical correct form.
  const blank = state.block.el.querySelector('#ff-blank');
  if (blank) {
    blank.textContent = item.correct;
    blank.classList.remove('is-asked');
    blank.classList.add('is-filled-correct');
  }
  flashBurst(state.block.el);
  state.block.el.classList.add('is-correct');

  completeChain(item);
}

function onWrong(item) {
  sfxWrong();
  els.input.readOnly = true;
  els.input.classList.add('is-flash-wrong');

  // Reveal the correct form in red so the player learns from the miss.
  const blank = state.block.el.querySelector('#ff-blank');
  if (blank) {
    blank.textContent = item.correct;
    blank.classList.remove('is-asked');
    blank.classList.add('is-filled-wrong');
  }
  state.block.el.classList.add('is-shake', 'is-wrong');
  state.block.isDying = true;
  loseLife();
  if (state.lives <= 0) {
    setTimeout(() => endGame(), 460);
    return;
  }
  setTimeout(() => dissolveBlock(false), 520);
}

function completeChain(item) {
  state.streak += 1;
  state.completions += 1;
  const mult = streakMultiplier(state.streak);
  const points = Math.round(BASE_POINTS * mult);
  state.score += points;

  spawnScorePop(points, mult);
  spawnParticles();
  pulseScorePanel();

  // Per-level board entry — staggered verb / form / answer.
  const entry = { verb: item.verb, past: item.form, pp: item.correct };
  state.history.push(entry);
  state.completedThisRun.push(entry);
  renderHistory();

  state.block.isDying = true;
  renderHud();

  const justLevelledUp = state.completions > 0 && state.completions % LEVEL_STEP === 0;
  if (justLevelledUp) state.levelUpPending = true;

  setTimeout(() => dissolveBlock(true), 280);
  if (justLevelledUp) {
    setTimeout(() => showLevelUp(), 280 + 460 + 40);
  }
}

function pulseScorePanel() {
  if (!els.scorePanel) return;
  els.scorePanel.classList.remove('is-pulse');
  // Force reflow so the animation re-triggers on rapid chains.
  void els.scorePanel.offsetWidth;
  els.scorePanel.classList.add('is-pulse');
  setTimeout(() => els.scorePanel.classList.remove('is-pulse'), 520);
}

// ─── Level-up announcement ──────────────────────────────────────────────────
// Called after a chain completion crosses a level boundary (every LEVEL_STEP
// chains). Surfaces a celebratory overlay, pauses spawning, dismisses on tap
// or any key (or auto after 2.2s), then spawns the next block.
function showLevelUp() {
  if (!state.running) return; // game ended mid-trigger? drop it.
  const newLevel = levelFromCompletions(state.completions);
  els.levelUpNum.textContent = String(newLevel);
  els.levelUpSub.textContent = t('levelup_sub');
  els.levelUp.hidden = false;
  // Next frame so the CSS transition catches the class addition.
  requestAnimationFrame(() => els.levelUp.classList.add('is-shown'));
  sfxLevelUp();

  let dismissed = false;
  const dismiss = () => {
    if (dismissed) return;
    dismissed = true;
    clearTimeout(autoTimer);
    document.removeEventListener('keydown', onKey, true);
    els.levelUp.removeEventListener('click', dismiss);
    els.levelUp.classList.remove('is-shown');
    setTimeout(() => {
      els.levelUp.hidden = true;
      state.levelUpPending = false;
      // Reset the per-level board so the new level starts with 5 empty slots.
      state.history = [];
      renderHistory();
      if (state.running && state.lives > 0 && !state.block) spawnBlock();
    }, 260);
  };
  const onKey = (e) => {
    // Swallow ANY key during the overlay so 1/2/3/Esc don't fall through.
    e.preventDefault();
    e.stopPropagation();
    dismiss();
  };
  // Capture phase so this listener fires before the global keydown handler.
  document.addEventListener('keydown', onKey, true);
  els.levelUp.addEventListener('click', dismiss);
  const autoTimer = setTimeout(dismiss, 2200);
}

function dissolveBlock(spawnNext) {
  const blockEl = state.block && state.block.el;
  if (!blockEl) return;
  blockEl.classList.add('is-dissolve');
  setTimeout(() => {
    if (state.block && state.block.el) {
      state.block.el.remove();
      state.block = null;
    }
    // Don't auto-spawn while the level-up overlay is owning the screen;
    // showLevelUp()'s dismiss path takes over the next spawn.
    if (state.running && state.lives > 0 && !state.levelUpPending) spawnBlock();
  }, 460);
}

function loseLife() {
  state.lives = Math.max(0, state.lives - 1);
  state.streak = 0;
  sfxLifeLost();
  renderHud();
}

// ═══════════════════════════════════════════════════════════════════════════
//  Effects — burst, particles, score pop
// ═══════════════════════════════════════════════════════════════════════════
function flashBurst(blockEl) {
  const burst = document.createElement('div');
  burst.className = 'ff-burst';
  blockEl.appendChild(burst);
  setTimeout(() => burst.remove(), 500);
}

function spawnParticles() {
  if (!state.block) return;
  const blockEl = state.block.el;
  const rect = blockEl.getBoundingClientRect();
  const playRect = els.play.getBoundingClientRect();
  const cx = rect.left + rect.width / 2 - playRect.left;
  const cy = rect.top + rect.height / 2 - playRect.top;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = document.createElement('div');
    p.className = 'ff-particle';
    p.style.left = (cx - 4) + 'px';
    p.style.top  = (cy - 4) + 'px';
    const angle = (i / PARTICLE_COUNT) * Math.PI * 2 + Math.random() * 0.4;
    const dist = 70 + Math.random() * 50;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    p.style.transition = 'transform 0.6s cubic-bezier(.2,.7,.3,1), opacity 0.6s ease-out';
    els.play.appendChild(p);
    // Force a paint then animate
    requestAnimationFrame(() => {
      p.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${0.4 + Math.random() * 0.6})`;
      p.style.opacity = '0';
    });
    setTimeout(() => p.remove(), 650);
  }
}

function spawnScorePop(points, mult) {
  if (!state.block) return;
  const blockEl = state.block.el;
  const rect = blockEl.getBoundingClientRect();
  const playRect = els.play.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'ff-score-pop';
  pop.style.left = (rect.left + rect.width / 2 - playRect.left) + 'px';
  pop.style.top  = (rect.top - playRect.top - 8) + 'px';
  pop.innerHTML = `+${points}${mult > 1 ? `<span class="ff-mult">×${mult}</span>` : ''}`;
  els.play.appendChild(pop);
  setTimeout(() => pop.remove(), 900);
}

// ═══════════════════════════════════════════════════════════════════════════
//  Pause / Resume
// ═══════════════════════════════════════════════════════════════════════════
function togglePause() {
  if (!state.running) return;
  state.paused = !state.paused;
  els.pauseOverlay.classList.toggle('is-shown', state.paused);
  // Static cards: nothing to time-shift on resume. Disable the input while
  // paused so a stray Enter can't sneak in past the overlay.
  if (state.paused) els.input.readOnly = true;
  else if (state.block && !state.block.isDying) els.input.readOnly = false;
}

// ═══════════════════════════════════════════════════════════════════════════
//  Game lifecycle — start, end, reset
// ═══════════════════════════════════════════════════════════════════════════
async function startGame() {
  // Block until the sentence dataset has loaded — boot kicks off the fetch.
  if (!state.dataLoaded) {
    const originalLabel = els.startBtn.textContent;
    els.startBtn.disabled = true;
    els.startBtn.textContent = t('loading');
    try {
      await loadSentences();
      state.dataLoaded = true;
    } catch (err) {
      els.startBtn.textContent = t('load_failed');
      els.startBtn.disabled = false;
      return;
    }
    els.startBtn.textContent = originalLabel || t('start_btn');
    els.startBtn.disabled = false;
  }

  // Reset state
  state.score = 0;
  state.lives = STARTING_LIVES;
  state.streak = 0;
  state.completions = 0;
  state.history = [];
  state.completedThisRun = [];
  state.round = 1;
  state.paused = false;
  state.running = true;
  state.levelUpPending = false;
  refillDeck();
  state.nextItem = drawItem();
  els.startScreen.hidden = true;
  els.overScreen.hidden = true;
  els.levelUp.hidden = true;
  els.levelUp.classList.remove('is-shown');
  renderHud();
  renderHistory();
  renderNext();
  setupKeys();
  syncLayout();
  spawnBlock();
  tellPage(true);
  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
}

function endGame() {
  state.running = false;
  state.paused = false;
  if (state.block && state.block.el) state.block.el.remove();
  state.block = null;
  try { els.input.blur(); } catch (_) {}   // let the phone keyboard close

  const isNewBest = state.score > state.best;
  if (isNewBest) {
    state.best = state.score;
    writeBest(state.best);
  }
  els.finalScore.textContent = String(state.score);
  els.finalBest.textContent = String(state.best);
  els.newBest.hidden = !isNewBest;

  els.chainGrid.innerHTML = '';
  if (state.completedThisRun.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'ff-chain-grid-row';
    empty.style.opacity = '0.6';
    empty.textContent = t('no_chains');
    els.chainGrid.appendChild(empty);
  } else {
    for (const c of state.completedThisRun) {
      const row = document.createElement('div');
      row.className = 'ff-chain-grid-row';
      // c: { verb, past:form, pp:answer } → "label → answer" (no form names).
      row.textContent = `${c.verb} → ${c.pp}`;
      els.chainGrid.appendChild(row);
    }
  }
  els.overScreen.hidden = false;
}

function backToMenu() {
  tellPage(false);
  els.overScreen.hidden = true;
  els.startScreen.hidden = false;
  els.bestStart.textContent = String(state.best);
}

// ═══════════════════════════════════════════════════════════════════════════
//  Event wiring
// ═══════════════════════════════════════════════════════════════════════════
els.inputWrap.addEventListener('submit', (e) => {
  e.preventDefault();
  handleSubmit();
  // Tapping OK must not close the phone keyboard: focus back in the same tap.
  if (state.running) { try { els.input.focus({ preventScroll: true }); } catch (_) {} }
});
// Keep the focus in the input when OK is pressed with a mouse.
$('ff-go').addEventListener('mousedown', (e) => e.preventDefault());

els.startBtn.addEventListener('click', startGame);
els.againBtn.addEventListener('click', startGame);
els.menuBtn.addEventListener('click', backToMenu);

els.pauseBtn.addEventListener('click', togglePause);
els.pauseOverlay.addEventListener('click', () => { if (state.paused) togglePause(); });
els.closeBtn.addEventListener('click', () => {
  // Hub fallback — leave the game.
  if (document.referrer) history.back();
  else window.location.href = '/';
});

els.audioBtn.addEventListener('click', () => {
  state.audioOn = !state.audioOn;
  writeAudio(state.audioOn);
  els.audioBtn.classList.toggle('is-muted', !state.audioOn);
  els.audioBtn.innerHTML = state.audioOn ? ICON_SOUND : ICON_MUTE;
});

document.addEventListener('keydown', (e) => {
  // Game-over screen: Space/Enter → play again
  if (!els.overScreen.hidden) {
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      startGame();
    }
    return;
  }
  // Pause toggle — keep Esc as the toggle, but only when the input isn't
  // the one driving the key (player might want to clear it).
  if (e.key === 'Escape' && state.running) {
    e.preventDefault();
    togglePause();
  }
  // Submission is wired via the <form>'s 'submit' event above, which fires
  // on Enter inside the input. No need to handle key here.
});

// ═══════════════════════════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════════════════════════
(function boot() {
  // i18n: swap to ES only if user explicitly selected it. HTML default is DE
  // so there's no flash on the common path.
  document.documentElement.lang = LANG;
  applyStrings(document);
  showTeacherNote();
  syncLayout();
  window.addEventListener('resize', syncLayout);
  state.best = readBest();
  state.audioOn = readAudio();
  els.audioBtn.classList.toggle('is-muted', !state.audioOn);
  els.audioBtn.innerHTML = state.audioOn ? ICON_SOUND : ICON_MUTE;
  els.bestStart.textContent = String(state.best);
  renderHud();
  renderHistory();
  renderNext();
  // Kick off sentence load in the background so it's ready when Start is hit.
  loadSentences()
    .then(() => { state.dataLoaded = true; setupKeys(); })
    .catch(err => { console.warn('[lueckentext] sentence load failed', err); });
})();
</script>
</body>

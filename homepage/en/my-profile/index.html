<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>/* krabsy_lang-from-url */try{localStorage.setItem("krabsy_lang","en");}catch(_){}</script>
  <title>My profile — Krabsy</title>
  <meta name="description" content="My profile: your figure, your shells and your progress in all games and exercises at a glance. Free, no sign-up, saved on your device only.">
  <!-- /en/ is the Spanish pilot section (noindex), so this page is too. -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://krabsy.com/en/my-profile/">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2026-11-27">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2026-11-27">
  <meta property="og:title" content="My profile — Krabsy">
  <meta property="og:description" content="My profile: your figure, your shells and your progress in all games and exercises at a glance. Free, no sign-up, saved on your device only.">
  <meta property="og:image" content="https://krabsy.com/og-image.png">
  <meta property="og:url" content="https://krabsy.com/en/my-profile/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Krabsy">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/lib/krabsy-ui.css?v=2026-11-27-rv">
  <link rel="stylesheet" href="/lib/krabsy-profile.css?v=2026-11-27s">
  <link rel="stylesheet" href="/lib/krabsy-practice.css?v=2026-11-27">
  <!-- The live figure (lib/krabsy-figure.js) imports three.js by name. It is loaded only
       after the page is up and idle, with the landing pages' rules (lib/krabsy-profile.js). -->
  <script type="importmap">{ "imports": { "three": "/lib/vendor/three/three.module.min.js", "three/addons/": "/lib/vendor/three/addons/" } }</script>
</head>
<body>
  <div class="k-page">
    <header class="k-page-header">
      <a href="/en/spanish/" class="k-logo" aria-label="Krabsy"><span>kr</span><span class="k-logo-crab" aria-hidden="true"><img src="/favicon.png?v=2026-11-27" alt="" decoding="async"></span><span>bsy</span></a>
    </header>

    <main class="pf-main">
      <!-- 1 Me and my figure. The static content is the new-visitor state; lib/krabsy-profile.js
           fills in the child's figure, shells and class. -->
      <section class="pf-me">
        <div class="pf-fig" id="pfFig">
          <div class="pf-stage-wrap">
            <div class="pf-stage" id="pfStage" aria-hidden="true">
              <img class="pf-img" id="pfImg" draggable="false" src="/assets/figures/portraits/Protagonist_A.webp" alt="" width="192" height="192" decoding="async">
              <canvas class="pf-canvas" id="pfCanvas" hidden></canvas>
            </div>
            <a class="pf-pencil" id="pfPencil" href="/en/my-figure/" aria-label="Change figure" title="Change figure"><svg class="ki" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/lib/icons/krabsy-icons.svg?v=2026-11-27c#ki-practise"/></svg></a>
          </div>
          <p class="pf-fig-hint">Drag to spin · tap to jump</p>
        </div>
        <div class="pf-me-body">
          <div class="pf-me-head">
            <h1 class="pf-title">My profile</h1>
            <span class="pf-class-box" id="pfClass" hidden></span>
          </div>
          <div class="pf-shells" id="pfShells">
            <p class="pf-count"><svg class="ki pf-count-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/lib/icons/krabsy-icons.svg?v=2026-11-27c#ki-shell"/></svg><b>0</b><span>shells</span></p>
            <div class="pf-next">
              <div class="pf-next-bar"><span class="pf-next-track"><span class="pf-next-fill" style="width:0%"></span></span><span class="pf-next-gift"><svg class="ki" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/lib/icons/krabsy-icons.svg?v=2026-11-27c#ki-gift"/></svg></span></div>
              <p class="pf-next-text">150 more shells to the next surprise</p>
            </div>
          </div>
          <div class="pf-actions">
            <a class="kp-go pf-go" href="/en/spanish/practice/" data-kp-ring><span class="kp-go-ico" data-kp-ring-ico="32" aria-hidden="true"></span><span class="kp-go-txt"><b><span>Practice now</span><span class="kp-go-sep"> · </span><span>5 minutes</span></b><small data-kp-ring-text>0 of 3 this week</small></span></a>
            <a class="pf-btn" id="pfFigureBtn" href="/en/my-figure/">Build your figure</a>
          </div>
        </div>
      </section>

      <!-- 2 collection, 3 topics, 4 trophies: rendered by lib/krabsy-profile.js -->
      <div class="pf-body" id="pfBody"><noscript><p class="pf-note">Krabsy needs JavaScript for this page.</p></noscript></div>

      <p class="pf-note">Everything here is saved on this device only, without an account. If you clear the browser data, it is gone.</p>
    </main>

    <footer class="k-footer">
      <span>© 2026 Krabsy</span>
      <span class="k-footer-legal-sep" aria-hidden="true">·</span>
      <span class="k-footer-legal-mount"></span>
    </footer>
  </div>
  <script type="module" src="/lib/krabsy-profile.js?v=2026-11-27s"></script>
  <script type="module" src="/lib/krabsy-practice-week.js?v=2026-11-27l"></script>
  <script src="/lib/krabsy-footer.js?v=2026-11-27h" defer></script>
  <script type="module" src="/lib/krabsy-header.js?v=2026-11-27-rv"></script>
  <script src="/lib/krabsy-analytics.js?v=2026-11-22" defer></script>
</body>
</html>

<body>
  <div class="k-page">
    <header class="k-page-header">
      <a href="/en/spanish/" class="k-logo" aria-label="Krabsy"><span>kr</span><span class="k-logo-crab" aria-hidden="true"><img src="/favicon.png?v=2026-11-27" alt="" decoding="async"></span><span>bsy</span></a>

        <h1 class="mf-title">My figure</h1>

        <div class="mf-next" id="mfWallet"></div>
      </div>

          <div class="mf-bar" id="mfBar"></div>
        </div>

          <div class="mf-tabs" id="mfTabs" role="tablist"></div>
          <div class="mf-panes" id="mfPanes"></div>
          <div class="mf-foot">
            <div class="mf-saved" id="mfSaved" role="status"></div>
            <div class="mf-actions">
              <button type="button" id="mfRand"></button><button type="button" id="mfReset"></button><button type="button" id="mfSave" class="mf-save"></button>
            </div>
          </div>
        </div>
      </div>

      <section class="mf-info">
<p class="mf-how"><span><svg class="ki" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/lib/icons/krabsy-icons.svg?v=2026-11-27c#ki-shell"/></svg>1 shell for every right answer</span><span><svg class="ki" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/lib/icons/krabsy-icons.svg?v=2026-11-27c#ki-gift"/></svg>A gift every 150 shells</span></p>
<p class="mf-local">Saved on this device only.</p>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, indexifembedded">
<title>Verb Dungeon — Krabsy</title>
<style>
@font-face{font-family:'Fredoka One';font-weight:400;font-display:swap;
  src:url(fonts/fredoka-one-400-latin.woff2) format('woff2');}
@font-face{font-family:'Nunito';font-weight:400 900;font-display:swap;
  src:url(fonts/nunito-400-latin.woff2) format('woff2');}
:root{--navy:#0d2240;--teal:#2ee6c0;--coral:#ff8585;--amber:#ffcf5e;--ink:#eaf2ff;--muted:#9db4dd;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:#060d1c;color:var(--ink);
  font-family:'Nunito',sans-serif;font-weight:800;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
img{-webkit-user-drag:none;pointer-events:none;}
canvas{display:block;width:100%;height:100%;}
h1,h2,.fredoka{font-family:'Fredoka One';font-weight:400;}
.base{color:var(--amber);} .past{color:var(--teal);} .pp{color:var(--coral);}
.arrow{color:#6f89b8;margin:0 .35em;}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(3,7,18,.75) 100%);}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:none;z-index:7;justify-content:space-between;
  align-items:flex-start;padding:14px 16px;pointer-events:none;}
#hud.on{display:flex;}
.pill{background:rgba(13,34,64,.82);border-radius:999px;padding:7px 16px;font-size:16px;}
#hearts{font-size:22px;letter-spacing:3px;color:var(--coral);}
#hearts .off{color:#2b4370;}
.hudLeft{display:flex;gap:8px;align-items:center;}
#keySlot{font-size:20px;padding:6px 12px;filter:grayscale(1);opacity:.35;transition:opacity .2s,box-shadow .2s;}
#keySlot.on{filter:none;opacity:1;box-shadow:0 0 0 3px var(--amber),0 0 18px rgba(255,207,94,.7);animation:keyGot .5s;}
@keyframes keyGot{40%{scale:1.35;}}
.keyfly{position:fixed;pointer-events:none;font-size:40px;transform:translate(-50%,-50%);z-index:5;
  transition:left .55s cubic-bezier(.5,0,.3,1),top .55s cubic-bezier(.5,0,.3,1),scale .55s;}
.coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:var(--amber);
  box-shadow:inset 0 0 0 .14em #c98f1c;vertical-align:-.08em;margin-right:.3em;}
.coin.big{width:30px;height:30px;margin:0;}
#coinBox{color:var(--amber);font-size:17px;padding:7px 14px;}
.pips{margin-left:6px;letter-spacing:2px;} .pips i{font-style:normal;}
.pips i.off{opacity:.22;filter:grayscale(1);}
#mute{pointer-events:auto;cursor:pointer;border:0;color:var(--ink);font:inherit;font-size:16px;}
#hint{position:fixed;left:50%;top:62px;transform:translateX(-50%);opacity:0;transition:opacity .3s;
  pointer-events:none;background:rgba(13,34,64,.86);border-radius:999px;padding:8px 20px;
  font-size:17px;color:var(--amber);white-space:nowrap;}
#hint.on{opacity:1;}
/* "Space: read the book" over the thing Space would open (book, chest, boss stone) */
#prompt{position:fixed;left:0;top:0;transform:translate(-50%,-100%);display:none;align-items:center;gap:6px;
  pointer-events:none;background:rgba(13,34,64,.9);border:2px solid var(--teal);border-radius:999px;
  padding:5px 14px 5px 7px;font-size:16px;color:var(--ink);white-space:nowrap;z-index:3;
  box-shadow:0 0 14px rgba(46,230,192,.35);animation:promptBob 1.2s ease-in-out infinite;}
#prompt.on{display:inline-flex;}
#prompt kbd{margin:0 2px 0 0;background:var(--teal);color:#06231d;}
#prompt .pSw{display:inline-block;width:24px;height:24px;border-radius:50%;background:#13294d;border:2px solid var(--teal);padding:3px;}
#prompt .pSw svg{display:block;width:100%;height:100%;}
@keyframes promptBob{50%{margin-top:-5px;}}
.carding #prompt{display:none;}
@media (max-height:500px){#prompt{font-size:13px;padding:3px 10px 3px 5px;}}
.carding #hint{opacity:0;}

/* Question card: in the middle of the screen over the dimmed, paused room */
#ask{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at 50% 50%,rgba(6,13,28,.5) 0%,rgba(3,7,18,.84) 100%);
  opacity:0;pointer-events:none;transition:opacity .18s;}
#ask.on{opacity:1;pointer-events:auto;}
#askCard{position:relative;width:min(660px,100%);text-align:center;border-radius:30px;padding:20px 30px 18px;
  background:linear-gradient(180deg,#16335e 0%,#0d2240 55%);border:3px solid var(--edge,var(--amber));
  box-shadow:0 0 0 7px rgba(13,34,64,.55),0 26px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08);
  transform:scale(.86);transition:transform .25s cubic-bezier(.3,1.5,.5,1),border-color .25s;}
#ask.on #askCard{transform:scale(1);}
#askCard.past{--edge:var(--teal);} #askCard.pp{--edge:var(--coral);}
#askHead{display:inline-flex;align-items:center;gap:10px;padding:5px 18px 5px 8px;border-radius:999px;
  background:rgba(6,13,28,.6);color:var(--amber);font-size:17px;}
#askIcon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:rgba(255,207,94,.16);font-size:20px;}
#steps{position:absolute;top:22px;right:24px;display:flex;gap:7px;}
#steps i{width:13px;height:13px;border-radius:50%;background:#2b4370;}
#steps i.now{background:var(--edge);box-shadow:0 0 10px var(--edge);} #steps i.done{background:var(--teal);}
#chain{font-family:'Fredoka One';font-weight:400;font-size:clamp(34px,calc(4.4 * var(--lvw,1vw)),56px);white-space:nowrap;
  margin:20px 0 2px;line-height:1.25;}
.blank{display:inline-block;min-width:3em;border-bottom:5px dashed #3a5584;color:transparent;}
.blank.ask{color:inherit;border-radius:12px 12px 0 0;animation:askPulse 1.4s ease-in-out infinite;}
.blank.ask.past{border-color:var(--teal);background:rgba(46,230,192,.13);color:var(--teal);}
.blank.ask.pp{border-color:var(--coral);background:rgba(255,133,133,.13);color:var(--coral);}
@keyframes askPulse{50%{background-color:rgba(255,255,255,.04);}}
.filled{display:inline-block;animation:filled .45s ease-out;}
@keyframes filled{0%{scale:.4;opacity:0;}60%{scale:1.25;opacity:1;}}
#chips{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.chip{font:inherit;font-family:'Fredoka One';font-weight:400;font-size:clamp(22px,calc(2.4 * var(--lvw,1vw)),29px);color:var(--ink);
  background:#17345f;border:0;border-bottom:5px solid #0a1b36;border-radius:16px;padding:11px 24px 9px 14px;
  min-width:156px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .1s,background .1s;}
.chip small{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  background:rgba(6,13,28,.6);color:var(--muted);font-family:'Nunito';font-weight:900;font-size:15px;}
.chip:hover{background:#1f437a;transform:translateY(-2px);}
.chip:hover small{color:var(--edge,var(--amber));}
.chip.wrong{animation:shake .35s;background:#3a2232;color:#7d6270;cursor:default;transform:none;}
.chip.wrong small{color:#7d6270;}
@keyframes shake{25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
#teach{margin-top:14px;font-size:17px;color:var(--muted);min-height:24px;}
#teach .arrow{margin:0 .25em;}
#askLater{font:inherit;font-size:16px;color:var(--muted);background:transparent;border:2px solid #2b4370;
  border-radius:12px;padding:5px 14px;margin-top:10px;cursor:pointer;display:none;}
#askLater:hover{color:var(--ink);border-color:var(--muted);}
#askLater kbd{font-size:13px;margin:0 0 0 6px;}
#askCard.chest #askLater{display:inline-block;}
@media (max-height:640px){#askCard{padding:14px 24px 12px;} #chain{margin:12px 0 0;} #chips{margin-top:14px;}}
/* Rune doors and the bridge: their words are out in the room; a small line says what to do */
#sign{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;pointer-events:none;
  transition:opacity .2s;background:rgba(13,34,64,.9);border:2px solid rgba(46,230,192,.45);border-radius:18px;
  padding:7px 28px 8px;text-align:center;white-space:nowrap;}
#sign.on{opacity:1;}
#signChain{font-family:'Fredoka One';font-weight:400;font-size:28px;}
#signChain .blank{min-width:2.6em;border-bottom-width:4px;}
#signHow{font-size:15px;color:var(--ink);margin-top:1px;}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);opacity:0;transition:opacity .25s;
  pointer-events:none;background:rgba(13,34,64,.95);border:3px solid rgba(46,230,192,.5);
  border-radius:18px;padding:10px 24px;font-family:'Fredoka One';font-weight:400;font-size:26px;
  white-space:nowrap;}
#toast.on{opacity:1;}
.pop{position:fixed;pointer-events:none;font-family:'Fredoka One';font-weight:400;font-size:30px;
  color:var(--amber);text-shadow:0 3px 0 #0a1b36;transform:translate(-50%,-50%);
  animation:pop .9s ease-out forwards;white-space:nowrap;}
.pop.hold{animation-delay:-.28s;animation-play-state:paused;}
@keyframes pop{0%{opacity:0;margin-top:0;scale:.5;}20%{opacity:1;scale:1.15;}
  100%{opacity:0;margin-top:-70px;scale:1;}}

/* Screens */
.screen{position:fixed;inset:0;display:none;align-items:safe center;justify-content:center;
  background:rgba(6,13,28,.62);padding:16px;overflow-y:auto;touch-action:pan-y;}
.screen.on{display:flex;}
.card{background:rgba(13,34,64,.95);border-radius:26px;padding:20px 34px 22px;text-align:center;
  max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.55);}
.card h1{margin:0;font-size:46px;color:var(--teal);}
.card h2{margin:0 0 6px;font-size:36px;color:var(--teal);}
.card p{margin:8px 0 0;color:var(--muted);font-size:17px;}
#levels{display:flex;gap:14px;justify-content:center;margin:16px 0 14px;}
.lvl{font:inherit;color:var(--ink);background:#17345f;border:0;border-bottom:5px solid #0a1b36;
  border-radius:18px;padding:14px 20px 12px;cursor:pointer;min-width:150px;}
.lvl:hover{background:#1f437a;}
.lvl.sel{outline:3px solid var(--teal);outline-offset:2px;}
.lvl b{display:block;font-family:'Fredoka One';font-weight:400;font-size:24px;}
.lvl span{display:block;margin-top:4px;font-size:22px;letter-spacing:2px;color:var(--amber);}
.lvl span i{font-style:normal;color:#2b4370;}
.lvl:disabled{opacity:.45;cursor:default;}
#heroTitle{margin:0 0 8px;font-size:15px;color:var(--amber);}
#heroes{margin:0 0 16px;font-size:15px;}
#heroRow{display:flex;gap:10px;justify-content:center;margin:0 0 8px;}
.hero{position:relative;font:inherit;color:var(--ink);background:#17345f;border:0;border-bottom:4px solid #0a1b36;
  border-radius:14px;padding:6px 6px 5px;cursor:pointer;width:96px;}
.hero:hover{background:#1f437a;}
.hero img{display:block;width:72px;height:72px;margin:0 auto 3px;border-radius:10px;object-fit:cover;
  background:linear-gradient(#295286,#1b3d6a 55%,#0c1f3f);}
.hero b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;}
.hero.sel{outline:3px solid var(--teal);outline-offset:2px;}
.hero.sel::after{content:'✓';position:absolute;top:2px;right:6px;color:var(--teal);font-weight:900;font-size:15px;
  text-shadow:0 1px 2px #0a1b36;}
/* keyboard row (↓/↑ in the menu): the active row's choice glows, the level row dims while the heroes are active */
#heroRow.kb .hero.sel{box-shadow:0 0 0 7px rgba(46,230,192,.28);} #levels:not(.kb) .lvl.sel{outline-color:rgba(46,230,192,.4);}
.figLink{color:var(--teal);font-weight:800;text-decoration:none;border-bottom:2px solid rgba(46,230,192,.45);}
.figLink:hover{border-bottom-color:var(--teal);}
#endCoins{color:var(--amber);min-height:0;}
#howto{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:15px;color:var(--muted);}
#howto div{background:rgba(6,13,28,.5);border-radius:12px;padding:7px 12px;}
kbd{font-family:inherit;color:var(--ink);background:rgba(255,255,255,.12);border-radius:6px;
  padding:1px 7px;margin-right:4px;}
#example{margin-top:16px;font-family:'Fredoka One';font-weight:400;font-size:24px;}
#stars{font-size:54px;letter-spacing:6px;color:var(--amber);margin:6px 0 2px;}
#stars i{font-style:normal;color:#2b4370;}
#missed{margin:12px auto 0;font-family:'Fredoka One';font-weight:400;font-size:20px;line-height:1.5;}
.btns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.btn{font:inherit;font-size:19px;color:#06231d;background:var(--teal);border:0;
  border-bottom:4px solid #159a80;border-radius:14px;padding:10px 22px;cursor:pointer;}
.btn.alt{background:#17345f;color:var(--ink);border-bottom-color:#0a1b36;}
#fade{position:fixed;inset:0;background:#060d1c;opacity:0;pointer-events:none;transition:opacity .35s;
  display:flex;align-items:center;justify-content:center;font-family:'Fredoka One';font-weight:400;
  font-size:30px;color:var(--teal);}
#fade.on{opacity:1;}
#loading{position:fixed;inset:0;background:#060d1c;display:flex;align-items:center;
  justify-content:center;font-family:'Fredoka One';font-weight:400;font-size:26px;color:var(--teal);
  white-space:pre-wrap;text-align:center;padding:20px;}
#rotate{position:fixed;inset:0;background:#0d2240;display:none;align-items:center;
  justify-content:center;text-align:center;padding:30px;font-size:20px;line-height:1.5;z-index:9;}
/* Sideways mode (src/rotate.js): a phone held upright gets the game turned by 90°, so it
   plays in landscape even with rotation lock on. #rotate only shows if scripts fail. */
html.rot body{position:fixed;top:0;left:0;width:var(--lw);height:var(--lh);overflow:hidden;
  transform-origin:top left;transform:rotate(90deg) translateY(-100%);}
@media (max-width:640px) and (orientation:portrait){html:not(.rot) #rotate{display:flex;}}
/* phones in landscape (and other short screens): the menu and end screen fit without scrolling */
@media (max-height:500px){
  .screen{padding:8px;}
  .card{padding:10px 22px 12px;border-radius:20px;}
  .card h1{font-size:30px;} .card h2{font-size:28px;}
  .card p{font-size:14px;margin-top:4px;}
  #levels{margin:8px 0 8px;gap:10px;} .lvl{padding:6px 16px 5px;min-width:118px;}
  .lvl b{font-size:19px;} .lvl span{font-size:16px;margin-top:0;}
  #heroTitle{margin:0 0 4px;font-size:13px;}
  #heroes{margin:0 0 8px;font-size:13px;} #heroRow{gap:8px;margin-bottom:4px;}
  .hero{width:80px;padding:4px 4px 3px;} .hero img{width:50px;height:50px;} .hero b{font-size:12px;}
  #howto{font-size:13px;gap:6px;} #howto div{padding:4px 9px;}
  #example{display:none;}
  #stars{font-size:38px;margin:2px 0 0;} #missed{font-size:17px;margin-top:6px;line-height:1.35;}
  .btns{margin-top:10px;} .btn{font-size:16px;padding:7px 16px;}
  #sign{bottom:6px;padding:3px 18px 4px;border-radius:14px;} #signChain{font-size:21px;} #signHow{font-size:12px;}
  #toast{bottom:14px;font-size:20px;padding:6px 16px;} #hint{top:46px;font-size:14px;padding:6px 14px;}
  #hud{padding:6px 10px;} #hud .pill{font-size:13px;padding:4px 11px;} #hearts{font-size:17px;} #keySlot{font-size:15px;}
}
#focus{position:fixed;inset:0;display:none;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(6,13,28,.55);z-index:8;}
#focus.on{display:flex;}
#focus div{background:rgba(13,34,64,.95);border:3px solid var(--teal);border-radius:20px;padding:16px 30px;
  font-family:'Fredoka One';font-weight:400;font-size:28px;color:var(--teal);}
/* Touch controls (src/touch.js): only on touch devices and only while a level runs */
#tStick,#tSword{display:none;}
.touch body.playing #tStick,.touch body.playing #tSword{display:block;}
#tStick{position:fixed;left:calc(34px + env(safe-area-inset-left));bottom:calc(34px + env(safe-area-inset-bottom));
  width:116px;height:116px;margin:0;border-radius:50%;pointer-events:none;z-index:4;
  background:radial-gradient(circle,rgba(13,34,64,.25) 0%,rgba(13,34,64,.55) 70%);
  border:3px solid rgba(234,242,255,.28);opacity:.55;transition:opacity .15s;}
#tStick.on{transform:translate(-50%,-50%);opacity:1;border-color:rgba(46,230,192,.7);}
.tKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 40% 35%,#eaf2ff 0%,#9db4dd 70%);box-shadow:0 3px 10px rgba(0,0,0,.5);}
#tStick.on .tKnob{background:radial-gradient(circle at 40% 35%,#d8fff6 0%,var(--teal) 75%);}
#tSword{position:fixed;right:calc(30px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));
  width:112px;height:112px;border-radius:50%;z-index:5;padding:20px;cursor:pointer;touch-action:none;
  background:radial-gradient(circle at 50% 35%,#1f437a 0%,#13294d 75%);border:4px solid var(--teal);
  border-bottom-width:8px;box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 0 6px rgba(13,34,64,.5);}
#tSword svg{display:block;width:100%;height:100%;}
#tSword.down{transform:translateY(3px) scale(.92);border-bottom-width:4px;background:radial-gradient(circle at 50% 35%,#2ee6c0 0%,#159a80 80%);}
.carding #tSword{opacity:.35;}
@media (max-height:500px){
  #tStick{width:96px;height:96px;left:calc(22px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));}
  .tKnob{width:44px;height:44px;}
  #tSword{width:92px;height:92px;padding:16px;right:calc(20px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));}
}
/* touch: no key hints; the bottom sign keeps clear of stick and button */
.touch #askLater kbd,.touch .chip small{display:none;}
.touch .chip{padding:13px 24px 11px;}
.touch #sign{max-width:calc(var(--lw,100vw) - 340px);white-space:normal;}
.touch #toast{max-width:calc(var(--lw,100vw) - 300px);white-space:normal;text-align:center;}
#howto .ico{display:inline-block;width:22px;height:22px;vertical-align:-6px;margin-right:6px;font-style:normal;}
#howto .stickIco{border-radius:50%;border:2px solid var(--muted);background:radial-gradient(circle,var(--ink) 0 4px,transparent 5px);}
#howto .swordIco svg{width:22px;height:22px;}
#qa{position:fixed;left:0;bottom:0;margin:0;font:12px monospace;color:#9db4dd;display:none;}
</style>

<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="hud">
  <div class="hudLeft"><div class="pill" id="hearts"></div><div class="pill" id="keySlot">🔑</div><div class="pill" id="coinBox"><i class="coin"></i><b id="coinN">0</b></div></div>
  <div class="pill" id="roomLabel"></div>
  <button class="pill" id="mute"></button>
</div>
<div id="hint"></div>
<div id="prompt"></div>

<div id="sign"><div id="signChain"></div><div id="signHow"></div></div>
<div id="ask">
  <div id="askCard">
    <div id="askHead"><span id="askIcon"></span><span id="askTitle"></span></div>
    <div id="steps"></div>
    <div id="chain"></div>
    <div id="chips"></div>

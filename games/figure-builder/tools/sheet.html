<!doctype html>
<!-- Contact sheets for checking parts (node tools/sheet.cjs): ?sheet=heads|hats|outfits -->
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head><body style="margin:0;background:#13204a">
<script type="module">
import * as THREE from 'three';
import { FIGURES, HATS, buildFigure } from '../src/figure.js';
const sheet = new URLSearchParams(location.search).get('sheet') || 'heads';
const hats = Object.keys(HATS);
let grid = [];   // rows of configs
if (sheet === 'heads') grid = [FIGURES.map((h) => ({ outfit: 'Protagonist_B', head: h }))];
if (sheet === 'outfits') grid = [FIGURES.map((f) => ({ outfit: f, head: f }))];
if (sheet === 'hats') grid = FIGURES.map((h) => hats.map((hat) => ({ outfit: 'Protagonist_B', head: h, hat })));
const cols = Math.max(...grid.map((r) => r.length)), rows = grid.length;
const W = 150 * cols, H = (sheet === 'hats' ? 150 : 300) * rows;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#13204a');
scene.add(new THREE.HemisphereLight('#ffffff', '#5a4a7a', 1.7));
const d = new THREE.DirectionalLight('#ffffff', 1.3); d.position.set(2, 4, 6); scene.add(d);
const sx = 1.5, sy = sheet === 'hats' ? 1.5 : 3;
for (let j = 0; j < rows; j++) for (let i = 0; i < grid[j].length; i++) {
  const f = await buildFigure(grid[j][i], { base: '../assets/' });
  f.root.position.set(i * sx, -j * sy - (sheet === 'hats' ? 1.65 : 0), 0); f.root.rotation.y = 0.35; scene.add(f.root);
}
const top = sheet === 'hats' ? 0.75 : 2.9;
const cam = new THREE.OrthographicCamera(-sx / 2, cols * sx - sx / 2, top, top - rows * sy, 0.1, 50); cam.position.set(0, 0, 20);
r.render(scene, cam); window.__done = true;
</script></body></html>

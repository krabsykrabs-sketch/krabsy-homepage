<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, indexifembedded">
<title>Egg Island — Krabsy</title>
<style>
@font-face{font-family:'Fredoka One';font-weight:400;font-display:swap;src:url(fonts/fredoka-one-400-latin.woff2) format('woff2');}
@font-face{font-family:'Nunito';font-weight:400 900;font-display:swap;src:url(fonts/nunito-400-latin.woff2) format('woff2');}
:root{--navy:#0d2240;--panel:rgba(13,34,64,.9);--teal:#2ee6c0;--coral:#ff8585;--amber:#ffcf5e;--ink:#eaf2ff;--muted:#9db4dd;
  --r-common:#f4f1ea;--r-uncommon:#6fdc7a;--r-rare:#5aa8ff;--r-epic:#b57bff;--r-legendary:#ffcf5e;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd8ff;color:var(--ink);font-family:'Nunito',sans-serif;font-weight:800;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
canvas{display:block;width:100%;height:100%;}
h1,h2,h3,.fredoka{font-family:'Fredoka One';font-weight:400;margin:0;}
button{font:inherit;color:inherit;border:0;cursor:pointer;}
.base{color:var(--amber);} .past{color:var(--teal);} .pp{color:var(--coral);}
.arrow{color:#6f89b8;margin:0 .3em;}
.coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:var(--amber);box-shadow:inset 0 0 0 .14em #c98f1c;vertical-align:-.1em;margin-right:.3em;flex:none;}
.starI{color:var(--amber);}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5;}
#hud.on{display:block;}
/* layout (owner 2026-11-26: too much stacked at the top): left = goals + lasting banners (event egg,
   raid), right = coins, backpack, stars; middle = only the hatch banner and one short message */
#rightCol{position:absolute;top:12px;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
#rightRow{display:flex;gap:8px;align-items:center;}
#leftCol{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;align-items:stretch;gap:8px;width:min(270px,30vw);}
#money{background:var(--panel);border-radius:18px;padding:6px 20px 7px;text-align:center;min-width:150px;}
#coins{font-family:'Fredoka One';font-size:30px;line-height:1.1;display:flex;align-items:center;justify-content:center;}
#cps{font-size:14px;color:var(--teal);}
#money.bump #coins{animation:bump .3s;}
@keyframes bump{40%{transform:scale(1.12);}}
#starsBox{background:var(--panel);border-radius:999px;padding:8px 16px;font-family:'Fredoka One';font-size:22px;}
#goals{background:var(--panel);border-radius:16px;padding:10px 12px;}
#goals h3{font-size:15px;color:var(--amber);margin-bottom:6px;}
.goal{font-size:13.5px;margin:5px 0;line-height:1.25;}
.goal .bar{height:6px;border-radius:3px;background:#24406e;margin-top:3px;overflow:hidden;}
.goal .bar i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:width .3s;}
.goal.done{color:var(--teal);animation:goalDone .8s;}
@keyframes goalDone{30%{transform:scale(1.08);}}
#buttons{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:10px;pointer-events:auto;}
.bigBtn{background:var(--panel);border-radius:16px;padding:10px 16px;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.25);position:relative;}
.bigBtn:active{transform:translateY(2px);box-shadow:none;}
.bigBtn .ico{font-size:22px;line-height:1;}
.badge{position:absolute;top:-6px;right:-6px;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;display:none;}
.badge.on{display:block;animation:pulse 1.2s infinite;}
@keyframes pulse{50%{transform:scale(1.2);}}
#soundBtn{position:absolute;left:190px;bottom:14px;pointer-events:auto;padding:8px 12px;font-size:20px;}

/* floating labels */
.lbl{position:fixed;transform:translate(-50%,-100%);pointer-events:none;z-index:4;white-space:nowrap;font-size:13px;
  background:rgba(13,34,64,.78);border-radius:999px;padding:2px 9px;}
.lbl.ready{background:var(--amber);color:var(--navy);font-family:'Fredoka One';font-size:16px;animation:pulse 1s infinite;}
.lbl.wait{background:var(--coral);color:#fff;}
.float{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:6;font-family:'Fredoka One';color:var(--amber);
  font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform 1.1s ease-out,opacity 1.1s ease-in;}
.float.big{font-size:28px;}
#topStack{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:94vw;}
.toast{position:relative;background:var(--panel);border-radius:14px;padding:10px 18px;z-index:9;
  font-size:17px;pointer-events:none;animation:toastIn .25s;max-width:90vw;text-align:center;}
.toast.warn{background:#7a2a3a;}
.toast.star{background:var(--amber);color:var(--navy);font-family:'Fredoka One';font-size:22px;}
@keyframes toastIn{from{transform:translateY(-10px);opacity:0;}}

/* question card */
#shade{position:fixed;inset:0;background:rgba(6,13,28,.55);z-index:10;display:none;}
#shade.light{background:rgba(6,13,28,.12);}
/* the thief card: compact at the bottom, so the crab and your eggs stay visible */
#card.compact{top:auto;bottom:14px;transform:translateX(-50%);padding:12px 18px 14px;width:min(520px,94vw);}
#card.compact.on{animation:cardUp .2s;}
@keyframes cardUp{from{transform:translate(-50%,30px);opacity:0;}}
#card.compact #trio{font-size:clamp(22px,4vw,32px);margin:8px 0 10px;}
#card.compact #cardSub{margin-top:4px;}
/* being hunted: a red pulsing edge */
body.hunted::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:3;
  box-shadow:inset 0 0 90px 30px rgba(255,70,60,.55);animation:hunted .62s infinite;}
@keyframes hunted{50%{box-shadow:inset 0 0 60px 14px rgba(255,70,60,.3);}}
#shade.on{display:block;}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;display:none;background:var(--navy);border-radius:24px;
  padding:22px 26px 24px;width:min(560px,92vw);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45);border:4px solid var(--rc,#fff);}
#card.on{display:block;animation:cardIn .2s;}
@keyframes cardIn{from{transform:translate(-50%,-46%) scale(.94);opacity:0;}}
#cardEgg{display:inline-block;padding:3px 14px;border-radius:999px;background:var(--rc);color:var(--navy);font-size:15px;}
#cardSub{color:var(--muted);font-size:15px;margin-top:8px;}
#trio{font-family:'Fredoka One';font-size:clamp(24px,5vw,40px);margin:16px 0 18px;white-space:nowrap;}
#trio .blank{display:inline-block;min-width:2.6em;border-bottom:5px solid #42577f;color:transparent;}
#trio .blank.ask-past{border-color:var(--teal);background:rgba(46,230,192,.13);border-radius:8px 8px 0 0;}
#trio .blank.ask-pp{border-color:var(--coral);background:rgba(255,133,133,.13);border-radius:8px 8px 0 0;}
#trio .filled{color:var(--teal);}
#chips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.chip{background:#1d3a66;border-radius:16px;padding:12px 18px;font-size:clamp(20px,3.6vw,26px);min-width:120px;font-family:'Fredoka One';
  box-shadow:0 4px 0 #0a1a33;display:flex;align-items:center;gap:10px;justify-content:center;}
.chip .k{font-family:'Nunito';font-size:13px;background:#0d2240;border-radius:6px;padding:1px 7px;color:var(--muted);}
.chip:hover{background:#25497f;}
.chip.right{background:var(--teal);color:var(--navy);}
.chip.right .k{display:none;}
.chip.off{opacity:.35;pointer-events:none;}
#typeIn{font-family:'Fredoka One';font-size:26px;padding:10px 14px;border-radius:14px;border:3px solid #2a4a7a;background:#0a1a33;color:var(--ink);width:min(300px,60vw);outline:none;}
#typeIn:focus{border-color:var(--teal);}
#typeIn.right{border-color:var(--teal);color:var(--teal);} #typeIn.wrong{border-color:var(--coral);color:var(--coral);text-decoration:line-through;}
#typeToggle{display:block;margin:10px auto 0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;}
#typeToggle.on{color:var(--teal);}
#trio.gap{white-space:normal;font-size:clamp(20px,3.4vw,30px);line-height:1.35;max-width:100%;}
#trio.gap.long{font-size:clamp(17px,2.7vw,24px);}
.gapBlank{min-width:3em;color:transparent;display:inline-block;}
.gapFill{color:var(--teal);border-bottom:4px solid var(--teal);}
.gapHint{color:var(--muted);font-size:.7em;}
.gapTeach{font-size:22px;line-height:1.35;}
.teachLine{max-width:460px;margin:6px auto 0;}
.chip{max-width:100%;}
.wGap{font-family:'Nunito';font-weight:800;font-size:15px;}
#feedback{min-height:28px;margin-top:16px;font-size:18px;}
#feedback .ok{color:var(--teal);font-family:'Fredoka One';font-size:24px;}
#feedback .bad{color:var(--coral);font-family:'Fredoka One';font-size:24px;}
#feedback .teach{font-family:'Fredoka One';font-size:26px;margin-top:6px;}
#feedback .small{color:var(--muted);font-size:14px;margin-top:4px;}
#goOn{margin-top:14px;background:var(--teal);color:var(--navy);border-radius:14px;padding:10px 28px;font-family:'Fredoka One';font-size:20px;display:none;}
#goOn.on{display:inline-block;}

/* panels (upgrades, book, creature) */
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;display:none;background:var(--navy);border-radius:24px;
  padding:18px 22px 20px;width:min(640px,94vw);max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.45);}
.panel.on{display:block;animation:cardIn .2s;}
.panel h2{font-size:26px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.x{background:#1d3a66;border-radius:12px;padding:4px 14px;font-size:15px;font-family:'Nunito';}
.upRow{display:flex;align-items:center;gap:12px;background:#15305a;border-radius:16px;padding:10px 14px;margin:8px 0;}
.upRow .ico{font-size:30px;width:40px;text-align:center;}
.upRow .txt{flex:1;}
.upRow .nm{font-family:'Fredoka One';font-size:19px;}
.upRow .ds{color:var(--muted);font-size:13.5px;}
.buy{background:var(--amber);color:var(--navy);border-radius:12px;padding:8px 14px;font-size:17px;display:flex;align-items:center;min-width:110px;justify-content:center;box-shadow:0 3px 0 #b8862a;}
.buy:disabled{background:#3a4c6e;color:#8193b5;box-shadow:none;cursor:default;}
.bookR h3{font-size:17px;margin:12px 0 6px;display:flex;justify-content:space-between;}
.bookR h3 small{font-family:'Nunito';font-size:13px;color:var(--muted);}
.bookGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.bookCell{background:#15305a;border-radius:14px;padding:6px 4px 8px;text-align:center;font-size:12px;border:2px solid transparent;}
.bookCell img{width:84px;height:84px;display:block;margin:0 auto;}
.bookCell.miss{color:#5d729a;}
.bookCell .n{min-height:2.4em;line-height:1.2;}
.wordList{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;}
.word{background:#15305a;border-radius:10px;padding:6px 10px;font-family:'Fredoka One';font-size:17px;}
.wOk{color:var(--teal);font-size:14px;}
.wordNone{color:var(--muted);font-size:14px;}
#bookHow{color:var(--muted);font-size:14px;}
.bookCell{position:relative;}
.goldMark{position:absolute;top:2px;right:4px;font-size:16px;}
.bookNote{color:var(--muted);font-size:13px;margin-top:12px;}
#creatureInfo{width:min(380px,92vw);text-align:center;}
#ciImg{width:150px;height:150px;}
#ciName{font-family:'Fredoka One';font-size:26px;}
#ciR{display:inline-block;padding:2px 12px;border-radius:999px;color:var(--navy);font-size:14px;margin:6px 0;}
#ciEarn{color:var(--teal);margin:4px 0 12px;}
#ciRelease{background:#1d3a66;border-radius:12px;padding:8px 16px;margin-top:6px;}
#ciAsk{color:var(--muted);font-size:13px;margin-top:8px;}

/* hatch reveal (does not block the game) */
#reveal{position:relative;display:none;background:var(--navy);border-radius:20px;
  padding:10px 20px 12px 10px;align-items:center;gap:12px;border:4px solid var(--rc,#fff);box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none;}
#reveal.on{display:flex;animation:revealIn .45s cubic-bezier(.3,1.6,.5,1);}
@keyframes revealIn{from{transform:scale(.4);opacity:0;}}
#reveal img{width:86px;height:86px;}
#revTitle{color:var(--muted);font-size:14px;}
#revName{font-family:'Fredoka One';font-size:24px;}
#revNew{background:var(--coral);color:#fff;border-radius:8px;padding:0 8px;font-size:14px;margin-left:6px;vertical-align:4px;}
#revInfo{font-size:14px;}

/* start screen */
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,30,60,.55);}
#start.off{display:none;}
#startBox{background:var(--navy);border-radius:28px;padding:28px 32px;width:min(520px,92vw);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45);}
#startBox h1{font-size:44px;color:var(--amber);}
#tagline{color:var(--ink);font-size:17px;margin:10px 0 16px;line-height:1.4;}
#welcome{background:#15305a;border-radius:16px;padding:10px 14px;margin:0 0 16px;font-size:16px;display:none;}
#welcome.on{display:block;}
#welcome b{color:var(--amber);}
#playBtn{background:var(--teal);color:var(--navy);border-radius:18px;padding:14px 44px;font-family:'Fredoka One';font-size:28px;box-shadow:0 5px 0 #1a9c82;}
#playBtn:disabled{opacity:.5;}
#resetBtn{display:block;margin:14px auto 0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;}
/* first person */
#cross{display:none !important;position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(13,34,64,.6);z-index:4;pointer-events:none;}
#prompt{position:fixed;left:50%;top:40%;transform:translate(-50%,-100%);z-index:5;pointer-events:none;display:none;
  background:var(--panel);border-radius:14px;padding:7px 16px;font-size:18px;white-space:nowrap;}
#prompt.on{display:block;}
#prompt .key{display:inline-block;background:var(--amber);color:var(--navy);border-radius:7px;padding:0 9px;margin-right:8px;font-family:'Fredoka One';}
#fade{position:fixed;inset:0;background:#0d2240;opacity:0;pointer-events:none;z-index:30;transition:opacity .35s;}
#fade.on{opacity:1;}
body.indoor #mapWrap,body.indoor #zoneName,body.indoor #coach{display:none;}
button.bookCell{font:inherit;color:inherit;cursor:pointer;}
button.bookCell:hover{background:#1d3a66;}
.earnS{color:var(--teal);font-size:12px;}
#coach{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);background:var(--teal);color:var(--navy);border-radius:16px;
  padding:10px 20px;font-family:'Fredoka One';font-size:20px;display:none;max-width:92vw;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25);}
#coach.on{display:block;}
#coach.pop{animation:coachPop .35s cubic-bezier(.3,1.6,.5,1);}
@keyframes coachPop{from{transform:translateX(-50%) scale(.7);}}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border-radius:14px;padding:8px 16px;font-size:16px;display:none;white-space:nowrap;}
#hint.on{display:block;}
#zoneName{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;font-family:'Fredoka One';font-size:46px;
  color:#fff;text-shadow:0 3px 0 rgba(13,34,64,.6);opacity:0;transition:opacity .6s;}
#zoneName.on{opacity:1;}
#mapWrap{position:absolute;left:12px;bottom:12px;width:170px;height:170px;}
#map{width:170px;height:170px;display:block;}
#carryBox{background:var(--panel);border-radius:999px;padding:6px 14px;font-size:16px;}
#c{cursor:grab;} #c.dragging{cursor:grabbing;}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.4);
  display:none;z-index:6;pointer-events:none;}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%);}
.tbtn{position:fixed;z-index:6;width:78px;height:78px;border-radius:50%;background:rgba(13,34,64,.7);border:3px solid rgba(255,255,255,.35);
  font-size:34px;display:none;align-items:center;justify-content:center;pointer-events:auto;}
body.touch .tbtn.on{display:flex;}
#jumpBtn{right:110px;bottom:24px;}
#actBtn{right:24px;bottom:110px;background:var(--amber);border-color:#fff;}
body.touch #buttons{bottom:auto;top:132px;}
body.touch #cross{display:none;}
#looks{display:flex;gap:12px;justify-content:center;align-items:center;margin:0 0 14px;flex-wrap:wrap;}
.lkTitle{width:100%;color:var(--muted);font-size:14px;}
.lk{background:#15305a;border-radius:16px;padding:4px;border:3px solid transparent;}
.lk.on{border-color:var(--teal);background:#1d3a66;}
.lk img{width:90px;height:108px;display:block;}
.lk{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink);}
.lk img{object-fit:contain;background:#102646;border-radius:12px;}
.lkName{font-size:12px;color:var(--muted);max-width:96px;line-height:1.2;}
.lk.on .lkName{color:var(--teal);font-weight:700;}
.lk:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
.lk.busy{opacity:.5;}
#looks .lk img{width:78px;height:94px;}
.figLink{color:var(--teal);font-weight:700;font-size:15px;text-decoration:none;border-bottom:2px solid rgba(46,230,192,.4);}
.figLink:hover{border-bottom-color:var(--teal);}
#controls{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.5;}
#controls b{color:var(--ink);}
#raidBanner{position:relative;background:#c0392b;color:#fff;border-radius:14px;padding:6px 12px;font-size:15px;display:none;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.25);}
#raidBanner.on{display:block;animation:toastIn .3s;}
#raidBanner b{font-family:'Fredoka One';font-weight:400;margin:0 4px;}
#evBanner{position:relative;background:var(--amber);color:var(--navy);border-radius:14px;
  padding:6px 12px;font-size:15px;display:none;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.25);}
#evBanner.on{display:block;animation:toastIn .3s;}
#evBanner.urgent b{color:#c0392b;animation:pulse .8s infinite;display:inline-block;}
#evBanner b{font-family:'Fredoka One';font-weight:400;margin:0 4px;}
.evDot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.35em;vertical-align:-.05em;box-shadow:inset 0 0 0 2px rgba(13,34,64,.35);}
.evArrow{display:inline-block;font-size:18px;margin-left:4px;transform-origin:50% 50%;}
.evArrow{rotate:-90deg;} /* ➤ points right; turn it to point up (= straight ahead) */
.bookGrid3{grid-template-columns:repeat(6,1fr);} .bookGrid2{grid-template-columns:repeat(4,1fr);max-width:67%;}
.bookGrid3 .bookCell img,.bookGrid2 .bookCell img{width:100%;height:auto;max-width:84px;}
@media (max-width:560px){.bookGrid3{grid-template-columns:repeat(3,1fr);} .bookGrid2{grid-template-columns:repeat(2,1fr);}}
#rotate{position:fixed;inset:0;z-index:30;background:var(--navy);display:none;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:20px;}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex;}}
@media (max-height:520px){#leftCol{width:220px;} #goals{padding:7px 10px;} .goal{font-size:12px;} #money{padding:4px 14px;} #coins{font-size:24px;}
  #card{padding:14px 18px;} #trio{margin:10px 0 12px;} .bigBtn{padding:7px 12px;font-size:14px;}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/",
    "./src/analytics.js": "./src/analytics.js?v=c678ee414b",
    "./src/animals.js": "./src/animals.js?v=c678ee414b",
    "./src/audio.js": "./src/audio.js?v=c678ee414b",
    "./src/balance.js": "./src/balance.js?v=c678ee414b",
    "./src/creatures.js": "./src/creatures.js?v=c678ee414b",
    "./src/decor.js": "./src/decor.js?v=c678ee414b",
    "./src/ground.js": "./src/ground.js?v=c678ee414b",
    "./src/guide.js": "./src/guide.js?v=c678ee414b",

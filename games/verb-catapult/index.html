<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, indexifembedded">
<title>Verb Catapult — Krabsy</title>
<style>
@font-face{font-family:'Fredoka One';font-weight:400;font-display:swap;
  src:url(fonts/fredoka-one-400-latin.woff2) format('woff2');}
@font-face{font-family:'Nunito';font-weight:400 900;font-display:swap;
  src:url(fonts/nunito-400-latin.woff2) format('woff2');}
:root{--navy:#0d2240;--teal:#2ee6c0;--coral:#ff8585;--amber:#ffcf5e;--ink:#eaf2ff;--muted:#9db4dd;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3f4;color:var(--ink);
  font-family:'Nunito',sans-serif;font-weight:800;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
canvas{display:block;width:100%;height:100%;}
h1,h2,.fredoka{font-family:'Fredoka One';font-weight:400;}
.base{color:var(--amber);} .past{color:var(--teal);} .pp{color:var(--coral);}
.arrow{color:#6f89b8;margin:0 .35em;}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:none;z-index:4;justify-content:space-between;
  align-items:flex-start;padding:12px 14px;pointer-events:none;gap:8px;}
#hud.on{display:flex;}
.hudSide{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pill{background:rgba(13,34,64,.82);border-radius:999px;padding:7px 16px;font-size:16px;white-space:nowrap;}
#stonesPill{display:flex;gap:5px;align-items:center;}
#stonesPill i{display:inline-block;width:15px;height:15px;border-radius:50%;background:#b7b2a6;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);}
#stonesPill i.off{opacity:.2;}
#points{color:var(--amber);}
#mute{pointer-events:auto;cursor:pointer;border:0;color:var(--ink);font:inherit;font-size:16px;}
#hint{position:fixed;left:50%;top:64px;transform:translateX(-50%);opacity:0;transition:opacity .3s;z-index:3;
  pointer-events:none;background:rgba(13,34,64,.86);border-radius:999px;padding:8px 20px;
  font-size:17px;color:var(--amber);white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.on{opacity:1;}
#basketBtn{position:fixed;z-index:3;display:none;transform:translate(-50%,-50%);font:inherit;font-family:'Fredoka One';
  font-weight:400;font-size:19px;color:#06231d;background:var(--teal);border:0;border-bottom:4px solid #159a80;
  border-radius:14px;padding:9px 18px;cursor:pointer;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;}
#basketBtn.on{display:block;}
@keyframes bob{50%{margin-top:-6px;}}

/* Question card */
#ask{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at 50% 50%,rgba(6,13,28,.35) 0%,rgba(3,7,18,.75) 100%);
  opacity:0;pointer-events:none;transition:opacity .18s;}
#ask.on{opacity:1;pointer-events:auto;}
#askCard{position:relative;width:min(660px,100%);text-align:center;border-radius:30px;padding:20px 30px 18px;
  background:linear-gradient(180deg,#16335e 0%,#0d2240 55%);border:3px solid var(--edge,var(--amber));
  box-shadow:0 0 0 7px rgba(13,34,64,.55),0 26px 80px rgba(0,0,0,.65);
  transform:scale(.86);transition:transform .25s cubic-bezier(.3,1.5,.5,1),border-color .25s;}
#ask.on #askCard{transform:scale(1);}
#askCard.past{--edge:var(--teal);} #askCard.pp{--edge:var(--coral);}
#askHead{display:inline-flex;align-items:center;gap:10px;padding:5px 18px 5px 8px;border-radius:999px;
  background:rgba(6,13,28,.6);color:var(--amber);font-size:17px;}
#askIcon{display:inline-block;width:30px;height:30px;border-radius:50%;background:#b7b2a6;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.25);transition:transform .3s,background .3s,width .3s,height .3s;}
#askIcon.pebble{width:18px;height:18px;margin:6px;} #askIcon.special{background:var(--amber);transform:scale(1.2);}
#steps{position:absolute;top:22px;right:24px;display:flex;gap:7px;}
#steps i{width:13px;height:13px;border-radius:50%;background:#2b4370;}
#steps i.now{background:var(--edge);box-shadow:0 0 10px var(--edge);}
#steps i.ok{background:var(--teal);} #steps i.no{background:#5a3a4a;}
#chain{font-family:'Fredoka One';font-weight:400;font-size:clamp(22px,min(4.4vw,7.5vw),56px);white-space:nowrap;
  margin:20px 0 2px;line-height:1.25;}
.blank{display:inline-block;min-width:3em;border-bottom:5px dashed #3a5584;color:transparent;}
.blank.ask{color:inherit;border-radius:12px 12px 0 0;animation:askPulse 1.4s ease-in-out infinite;}
.blank.ask.past{border-color:var(--teal);background:rgba(46,230,192,.13);color:var(--teal);}
.blank.ask.pp{border-color:var(--coral);background:rgba(255,133,133,.13);color:var(--coral);}
@keyframes askPulse{50%{background-color:rgba(255,255,255,.04);}}
.filled{display:inline-block;animation:filled .45s ease-out;}
@keyframes filled{0%{scale:.4;opacity:0;}60%{scale:1.25;opacity:1;}}
#chips{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.chip{font:inherit;font-family:'Fredoka One';font-weight:400;font-size:clamp(22px,2.4vw,29px);color:var(--ink);
  background:#17345f;border:0;border-bottom:5px solid #0a1b36;border-radius:16px;padding:11px 24px 9px 14px;
  min-width:156px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .1s,background .1s;}
.chip small{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  background:rgba(6,13,28,.6);color:var(--muted);font-family:'Nunito';font-weight:900;font-size:15px;}
.chip:hover{background:#1f437a;transform:translateY(-2px);}
.chip.right{background:#14614f;color:#fff;}
.chip.wrong{animation:shake .35s;background:#3a2232;color:#7d6270;cursor:default;transform:none;}
.chip:disabled{cursor:default;}
@keyframes shake{25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
#teach{margin-top:14px;font-size:17px;color:var(--muted);min-height:24px;}
@media (max-width:520px){#askCard{padding:16px 14px 14px;border-radius:24px;} #chain{margin-top:30px;}
  .blank{min-width:2.4em;} #steps{top:14px;right:16px;} #askHead{font-size:15px;}}
@media (max-height:520px){#askCard{padding:12px 20px 10px;} #chain{margin:8px 0 0;} #chips{margin-top:10px;}
  .chip{padding:7px 18px 6px 10px;min-width:120px;} #teach{margin-top:6px;}}

#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);opacity:0;z-index:5;
  transition:opacity .25s,transform .25s cubic-bezier(.3,1.5,.5,1);
  pointer-events:none;background:rgba(13,34,64,.95);border:3px solid rgba(46,230,192,.5);
  border-radius:18px;padding:10px 26px;font-family:'Fredoka One';font-weight:400;font-size:30px;white-space:nowrap;}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
.pop{position:fixed;pointer-events:none;font-family:'Fredoka One';font-weight:400;font-size:26px;z-index:3;
  color:var(--amber);text-shadow:0 3px 0 #0a1b36;transform:translate(-50%,-50%);
  animation:pop 1s ease-out forwards;white-space:nowrap;}
.pop.big{font-size:34px;color:#fff;}
@keyframes pop{0%{opacity:0;margin-top:0;scale:.5;}20%{opacity:1;scale:1.15;}100%{opacity:0;margin-top:-70px;scale:1;}}

/* Screens */
.screen{position:fixed;inset:0;display:none;align-items:safe center;justify-content:center;z-index:7;
  background:rgba(6,13,28,.55);padding:16px;overflow-y:auto;touch-action:pan-y;}
.screen.on{display:flex;}
.card{background:rgba(13,34,64,.95);border-radius:26px;padding:20px 34px 22px;text-align:center;
  max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.55);}
.card h1{margin:0;font-size:46px;color:var(--teal);}
.card h2{margin:0 0 6px;font-size:36px;color:var(--teal);}
.card p{margin:8px 0 0;color:var(--muted);font-size:17px;}
#levels{display:flex;gap:12px;justify-content:center;margin:16px 0 14px;flex-wrap:wrap;}
.lvl{font:inherit;color:var(--ink);background:#17345f;border:0;border-bottom:5px solid #0a1b36;
  border-radius:18px;padding:12px 18px 10px;cursor:pointer;min-width:120px;}
.lvl:hover{background:#1f437a;}
.lvl b{display:block;font-family:'Fredoka One';font-weight:400;font-size:22px;}
.lvl span{display:block;margin-top:4px;font-size:20px;letter-spacing:2px;color:var(--amber);}
.lvl span i{font-style:normal;color:#2b4370;}
.lvl:disabled{opacity:.4;cursor:default;}
#howto{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:15px;color:var(--muted);}
#howto div{background:rgba(6,13,28,.5);border-radius:12px;padding:7px 12px;}
kbd{font-family:inherit;color:var(--ink);background:rgba(255,255,255,.12);border-radius:6px;padding:1px 7px;margin-right:4px;}
#stars{font-size:54px;letter-spacing:6px;color:var(--amber);margin:6px 0 2px;}
#stars i{font-style:normal;color:#2b4370;}
#castleRows{margin:6px auto 0;font-size:17px;color:var(--muted);}
#castleRows div{display:flex;justify-content:space-between;gap:20px;max-width:320px;margin:2px auto;}
#castleRows b{color:var(--amber);letter-spacing:2px;}
#missed{margin:12px auto 0;font-family:'Fredoka One';font-weight:400;font-size:20px;line-height:1.5;}
.btns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.btn{font:inherit;font-size:19px;color:#06231d;background:var(--teal);border:0;
  border-bottom:4px solid #159a80;border-radius:14px;padding:10px 22px;cursor:pointer;}
.btn.alt{background:#17345f;color:var(--ink);border-bottom-color:#0a1b36;}
#loading{position:fixed;inset:0;background:#0d2240;display:flex;align-items:center;z-index:9;
  justify-content:center;font-family:'Fredoka One';font-weight:400;font-size:26px;color:var(--teal);}
#perf{position:fixed;left:8px;bottom:8px;font:12px monospace;color:#0d2240;background:rgba(255,255,255,.6);
  padding:2px 6px;border-radius:4px;display:none;z-index:9;pointer-events:none;}
@media (max-height:500px){
  .card{padding:10px 22px 12px;} .card h1{font-size:30px;} .card h2{font-size:26px;}
  .card p{font-size:14px;} #levels{margin:8px 0;} .lvl{padding:6px 12px;min-width:96px;}
  #stars{font-size:36px;} #missed{font-size:16px;} .btns{margin-top:10px;} .btn{font-size:16px;padding:7px 16px;}
}
</style>
</head>
<body>
<div id="loading">Loading …</div>
<div id="hud">
  <div class="hudSide"><div class="pill" id="castleNo"></div><div class="pill" id="stonesPill"></div></div>
  <div class="hudSide"><div class="pill" id="points">0</div><button class="pill" id="mute"></button></div>
</div>
<div id="hint"></div>
<button id="basketBtn"></button>
<div id="toast"></div>

<div id="ask"><div id="askCard">
  <div id="askHead"><span id="askIcon"></span><span id="askTitle"></span></div>
  <div id="steps"><i></i><i></i></div>
  <div id="chain"></div>
  <div id="chips"></div>
  <div id="teach"></div>
</div></div>

<div class="screen" id="menu"><div class="card">
  <h1>Verb Catapult</h1>
  <p id="tagline"></p>
  <div id="levels"></div>
  <div id="howto"></div>
</div></div>

<div class="screen" id="results"><div class="card">
  <h2 id="resTitle"></h2>
  <div id="stars"></div>
  <p id="resPoints"></p>
  <div id="castleRows"></div>
  <p id="resRight"></p>
  <div id="missed"></div>
  <div class="btns"><button class="btn" id="resNext"></button><button class="btn alt" id="resAgain"></button><button class="btn alt" id="resMenu"></button></div>
</div></div>
<div id="perf"></div>

<script src="vendor/planck.min.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module" src="src/main.js"></script>
</body>
</html>

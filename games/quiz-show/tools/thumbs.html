<!doctype html>
<!-- Renders one portrait per avatar (tools/make-thumbs.cjs saves them to assets/thumbs/). -->
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head><body style="margin:0;background:transparent">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { AVATARS } from '../src/room.js';
const S = 160;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(S, S); renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const loader = new GLTFLoader();
const out = {};
for (const name of AVATARS) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#ffffff', '#5a4a7a', 1.6));
  const d = new THREE.DirectionalLight('#ffffff', 1.4); d.position.set(2, 4, 5); scene.add(d);
  const g = await loader.loadAsync(`../assets/chars/${name}.glb`);
  const m = g.scene; m.rotation.y = 0.35; scene.add(m);
  const box = new THREE.Box3().setFromObject(m);
  const h = box.max.y - box.min.y;
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  // Head and shoulders.
  const cy = box.min.y + h * 0.66;
  cam.position.set(0, cy + 0.1, h * 1.75); cam.lookAt(0, cy, 0);
  renderer.render(scene, cam);
  out[name] = renderer.domElement.toDataURL('image/png');
}
window.__thumbs = out;
</script></body></html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, indexifembedded">
<title>Krabsy Quiz Room</title>
<link rel="stylesheet" href="src/style.css">
<style>
#join .card{width:min(520px,94vw);text-align:center;}
#join h1{margin:0 0 .4em;color:var(--amber);font-size:34px;}
#join label{display:block;text-align:left;color:var(--muted);font-size:16px;margin:12px 0 4px;}
#join input{width:100%;font-size:28px;padding:.3em .5em;border-radius:12px;border:3px solid #2d4180;background:#0d1735;color:#fff;font-weight:900;}
#join #codeIn{font-family:'Fredoka One';letter-spacing:.12em;text-transform:uppercase;text-align:center;}
#colors{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
#colors button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25);}
#colors button.on{outline:4px solid #fff;outline-offset:3px;}
#joinBtn{margin-top:18px;}
#joinErr{color:var(--coral);min-height:1.4em;margin-top:10px;font-size:17px;}

#hud{position:fixed;top:10px;left:10px;right:10px;z-index:8;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-size:18px;}
#hud .me{display:flex;gap:.6em;align-items:center;}
#hud .dot{width:.9em;height:.9em;border-radius:50%;display:inline-block;}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:8;font-size:18px;text-align:center;max-width:94vw;}
#status{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9;font-size:16px;background:#5a2232;}

/* question card: covers the screen until answered */
#qcard{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(6,10,28,.55);padding:12px;}
#qcard .card{width:min(860px,96vw);background:#f7f9ff;color:#0d1b3d;padding:18px 22px 22px;}
#qcard .head{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:#5b6b92;margin-bottom:10px;gap:12px;}
#qcard .head .timerbar{flex:1;background:#dfe6f7;}
#qcard .qline{font-size:clamp(30px,6vw,56px);text-align:center;margin:10px 0 18px;}
#qcard .box{font-size:clamp(24px,4.2vw,40px);min-height:2em;}
/* after answering: a small panel */
#mini{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:9;width:min(560px,92vw);text-align:center;}
#mini .card{padding:10px 16px;}
#mini .qline{color:#fff;font-size:26px;}
#mini .qline .slot{border-bottom-color:#7d90bd;}
#mini .sub{font-size:16px;color:var(--muted);margin-top:6px;}
#mini .timerbar{margin-top:8px;}
/* reveal */
#reveal{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:9;width:min(620px,94vw);text-align:center;}
#reveal .card{padding:14px 18px;}
#reveal h2{margin:0;font-size:34px;}
#reveal h2.ok{color:var(--teal);} #reveal h2.no{color:var(--coral);}
#reveal .qline{color:#fff;font-size:28px;margin:6px 0;}
#reveal .teach{font-family:'Fredoka One';font-size:22px;margin:4px 0;}
#reveal .meta{display:flex;justify-content:center;gap:14px;font-size:18px;color:var(--muted);flex-wrap:wrap;}
#reveal .meta b{color:var(--amber);}
#top5{position:fixed;right:10px;top:56px;z-index:8;width:220px;font-size:17px;}
#top5 h3{margin:0 0 6px;font-size:18px;color:var(--teal);}
#endc .card{text-align:center;width:min(560px,94vw);}
#endc h2{margin:0;color:var(--amber);font-size:36px;}
#endc .you{font-size:22px;margin:8px 0 14px;}
#endc .toplist{font-size:22px;text-align:left;}
#endc{background:rgba(6,10,28,.55);}
#msg .card{text-align:center;font-size:22px;}
@media (max-width:700px){#top5{display:none;}}
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="join" class="overlay">
  <div class="card">
    <h1 data-t="joinTitle"></h1>
    <label for="codeIn" data-t="code"></label>
    <input id="codeIn" maxlength="7" autocomplete="off" placeholder="ABC-123">
    <label for="nameIn" data-t="name"></label>
    <input id="nameIn" maxlength="16" autocomplete="off">
    <label data-t="color"></label>
    <div id="colors"></div>
    <button id="joinBtn" class="btn" data-t="join"></button>
    <div id="joinErr"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="me pill"><span class="dot" id="meDot"></span><span id="meName"></span></div>
  <div class="pill"><span id="meScore">0</span> <span data-t="score"></span></div>
</div>
<div id="status" class="pill hidden"></div>
<div id="hint" class="pill hidden"></div>

<div id="qcard" class="hidden"><div class="card">
  <div class="head"><span id="qnum"></span><div class="timerbar" id="qtimer"><i></i></div><span id="qsec"></span></div>
  <div class="qline" id="qline"></div>
  <div class="boxes" id="qboxes"></div>
</div></div>
<div id="mini" class="hidden"><div class="card"><div class="qline" id="miniLine"></div><div class="sub" data-t="sent"></div><div class="timerbar" id="miniTimer"><i></i></div></div></div>
<div id="reveal" class="hidden"><div class="card" id="revealCard"></div></div>
<div id="top5" class="card hidden"></div>
<div id="endc" class="overlay hidden"><div class="card" id="endCard"></div></div>
<div id="msg" class="overlay hidden"><div class="card" id="msgCard"></div></div>

<script type="module" src="src/child.js"></script>
</body>
</html>
